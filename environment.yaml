# conda / mamba environment for the two-layer QG testbed (contrib/qg2l)
channels:
  - conda-forge
  - pytorch
  - nvidia
dependencies:
  - python>=3.10
  - pip
  - pytorch::pytorch>=2.0
  - pytorch::pytorch-cuda=11.7   # remove for a CPU-only install
  - pytorch-lightning>=2.0
  - xarray
  - netCDF4
  - scipy
  - pandas
  - matplotlib
  - ffmpeg                       # mp4 animations (gif fallback otherwise)
  - jupyterlab                   # notebooks
  - ipykernel
  - papermill                    # headless notebook execution (Slurm)
  - pytest
  - pip:
    - hydra-core
    - kornia
