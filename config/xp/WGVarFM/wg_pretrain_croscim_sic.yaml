# @package _global_
# WeatherGenerator self-supervised pre-training on raw CROSCIM sensor data (SIC).
# One stream per sensor, each at its own resolution; masked HEALPix cells are reconstructed.
#   python main.py xp=WGVarFM/wg_pretrain_croscim_sic

paths:
  src: /Odyssey/private/m19beauc
  asip: /Odyssey/public/CROSCIM_dataset/ASIP_L3
  cimr: /Odyssey/public/CROSCIM_dataset/data_noise
  covariates: /Odyssey/public/CROSCIM_dataset/atm_data

# ===== STREAMS (shared by the reader, the tokenizer and the model) =====
# Point counts per HEALPix level-5 cell (~41 500 km2): 5 km -> ~1 660, 2.5 km -> ~6 640, 25 km -> ~66.
# token_size is chosen so each stream gives ~50 tokens per full cell.
streams:
  asip_sic:        # ASIP L3, 500 m native -> block mean x5 = 2.5 km
    files: ${paths.asip}/*nc
    date_fmt: "%Y%m%d"
    vars: [sic]
    coarsen: 5
    token_size: 128
    source: true
    target: true
    norm:
      sic: {min: 0.0, max: 100.0, type: minmax}
  cimr_SIC:        # CIMR, 5 km native
    files: ${paths.cimr}/CIMR5km_*nc
    date_fmt: "%Y-%m-%d"
    vars: [SIC]
    coarsen: 1
    token_size: 32
    source: true
    target: true
    norm:
      SIC: {min: 0.0, max: 1.0, type: minmax}
  covariates:      # ERA5 atmosphere, 5 km files -> x5 = 25 km, input only
    files: ${paths.covariates}/atm5km_*.nc
    date_fmt: "%Y-%m-%d"
    vars: [t2m, msl, u10, v10]
    coarsen: 5
    token_size: 8
    source: true
    target: false
    norm:
      msl: {mean: 101261.65922657882, std: 1112.7187312302365, type: zscore}
      t2m: {mean: -2.5985455071070955, std: 13.613745769755358, type: zscore}
      u10: {mean: 0.6010106010949151, std: 4.545559141871505, type: zscore}
      v10: {mean: -0.2104646166032582, std: 4.707062023219409, type: zscore}

healpix_level: 5

trainer:
  _target_: pytorch_lightning.Trainer
  accelerator: gpu
  devices: 1
  precision: bf16-mixed
  gradient_clip_val: 1.0
  limit_train_batches: 1000
  limit_val_batches: 100
  max_epochs: 100
  callbacks:
    - _target_: pytorch_lightning.callbacks.LearningRateMonitor
    - _target_: pytorch_lightning.callbacks.ModelCheckpoint
      monitor: val_loss
      save_top_k: 3
      filename: 'WG-{val_loss:.5f}-{epoch:03d}'

datamodule:
  _target_: contrib.WGVarFM.data.WGDataModule
  reader:
    _target_: contrib.WGVarFM.readers.croscim.CroscimReader
    streams: ${streams}
    domain_limits: {xc: {_target_: builtins.slice, _args_: [-3849750., 3749750.]},
                    yc: {_target_: builtins.slice, _args_: [2473750., -4896250.]}}
  streams: ${streams}
  healpix_level: ${healpix_level}
  masking_rate: 0.5
  batch_size: 1
  num_workers: 8
  domains:
    train:
      time: {_target_: builtins.slice, _args_: ['2022-05-01', '2022-11-30']}
    val:
      time: {_target_: builtins.slice, _args_: ['2022-12-01', '2022-12-31']}
    test:
      time: {_target_: builtins.slice, _args_: ['2021-02-01', '2021-02-15']}

model:
  _target_: contrib.WGVarFM.models.lit_wgfm.LitWGFM
  streams: ${streams}
  # optimizer / schedule: WG default_config values
  lr: 5.0e-5
  lr_start: 1.0e-6
  warmup_steps: 512
  betas: [0.975, 0.9875]
  weight_decay: 0.1
  wg:
    healpix_level: ${healpix_level}
    mixed_precision_dtype: bf16
    attention_dtype: bf16
    with_flash_attention: true
    norm_type: LayerNorm
    qk_norm_type: null
    norm_eps: 1.0e-4
    mlp_norm_eps: 1.0e-5
    embed_dropout_rate: 0.1
    embed_unembed_mode: block
    # sum over streams (and samples of the batch) of tokens in one cell
    ae_local_max_tokens_per_cell: 1024
    ae_local_dim_embed: 256
    ae_local_num_blocks: 2
    ae_local_num_heads: 8
    ae_local_dropout_rate: 0.1
    ae_local_with_qk_lnorm: true
    ae_local_num_queries: 1
    ae_local_queries_per_cell: false
    ae_adapter_embed: 128
    ae_adapter_num_heads: 8
    ae_adapter_with_residual: true
    ae_adapter_with_qk_lnorm: true
    ae_adapter_dropout_rate: 0.1
    ae_aggregation_num_blocks: 2
    ae_aggregation_att_dense_rate: 1.0
    ae_aggregation_block_factor: 64
    ae_aggregation_num_heads: 8
    ae_aggregation_dropout_rate: 0.1
    ae_aggregation_with_qk_lnorm: true
    ae_aggregation_mlp_hidden_factor: 2
    ae_global_dim_embed: 512
    ae_global_num_blocks: 4
    ae_global_num_heads: 8
    ae_global_att_dense_rate: 1.0
    ae_global_block_factor: 64
    ae_global_dropout_rate: 0.1
    ae_global_with_qk_lnorm: true
    ae_global_mlp_hidden_factor: 2
    num_register_tokens: 0
    num_class_tokens: 0
    latent_noise_kl_weight: 0.0
    decoder_type: PerceiverIOCoordConditioning
    pred_self_attention: true
    pred_mlp_adaln: true
    pred_adapter_kv: false
    stream_defaults:
      embed: {net: linear}
      embed_target_coords: {net: linear, dim_embed: 256}
      target_readout: {num_layers: 2, num_heads: 8}
      pred_head: {num_layers: 1, ens_size: 1}

entrypoints:
  - _target_: src.train.base_training
    trainer: ${trainer}
    lit_mod: ${model}
    dm: ${datamodule}
    save_dir: ${paths.src}/results_WGVarFM
