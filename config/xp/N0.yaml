# @package _global_
#
# CROSCIM flow-matching cascade, N0 (initialisation / analysis network):
# G_C -> G_M -> G_H on the nested 32 / 4 / 1 km grid, conditioned on contexts
# built on the fly (local encoders + upward pyramid + ERA5).
# See CROSCIM_FM_cascade/formulation and croscim/cascade.py.
#
# Phase 3 (G_C alone, no pyramid):
#   python main.py xp=N0 model.levels=[C] model.pyramid=false
# Full cascade (phases 4-5): defaults below. To train the fine levels on top
# of a trained G_C, set model.levels=[M,H] and init_weights_ckpt.
#
# Data: Zarr stores written by scripts/convert_sources.py
# next to the NetCDF directories under paths.data.

paths:
  src: /Odyssey/private/m19beauc
  data: /Odyssey/public/CROSCIM_dataset

trainer:
  _target_: pytorch_lightning.Trainer
  inference_mode: False
  gradient_clip_val: 0.5
  accelerator: gpu
  devices: [0]
  limit_train_batches: 1000
  limit_val_batches: 100
  max_epochs: 500
  precision: bf16-mixed
  callbacks:
    - _target_: pytorch_lightning.callbacks.LearningRateMonitor
      logging_interval: step
    - _target_: pytorch_lightning.callbacks.ModelCheckpoint
      monitor: val_loss
      save_top_k: 3
      save_last: true
      filename: 'FM-cascade-N0-{val_loss:.5f}-{epoch:03d}'

datamodule:
  _target_: croscim.data.CascadeDataModule
  root: ${paths.data}
  natural_earth_zip: ${hydra:runtime.cwd}/assets/ne_10m_land.zip
  train_dates: ???   # [first, last] analysis day, e.g. ["2021-01-15", "2022-09-30"]
  val_dates: ???
  test_dates: ???
  tiles_per_day: 8
  asip_weighted_tiles: false   # true for G_M / G_H: 80 % of the tiles drawn by ASIP coverage
  # single GPU: shuffle the days here; under DDP drop it (Lightning sets the sampler)
  dl_kw: {batch_size: 2, num_workers: 10, shuffle: true, pin_memory: true}  # 12 CPUs per Odyssey job

model:
  _target_: croscim.cascade.LitCascadeN0
  levels: [C, M, H]
  pyramid: true
  # [mean, std]. SIC / SIT / HS / forcing: same stats as the former CROSCIM
  # configs (SIC min-max [0, 1] = identity). S_C channels and detail scales
  # (dSIC_M, dSIT_M, dSIC_H; mean ignored): S_C measured by
  # scripts/inspect_data.py on 2022-01-15 .. 2022-10-31 (40 batches of 2
  # tiles). The scales of the corrections (corrector: true) are first
  # guesses from the M / H errors of the prolonged coarse fields
  # (exact details relative to P': 0.052, 0.0491, 0.012).
  norm:
    SIC: [0.0, 1.0]
    SIT: [0.5695980677516013, 0.8216149733058172]
    HS: [0.15517908473300512, 0.13962813089282153]
    h_ow: [0.2885, 0.4434]
    h_thin: [0.0233, 0.1034]
    h_mid: [0.0376, 0.1431]
    h_pack: [0.6503, 0.4635]
    sic_std: [0.0215, 0.0599]
    edge_density: [0.0056, 0.0322]
    aniso_c: [0.0053, 0.098]
    aniso_s: [-0.0043, 0.0935]
    sit_std: [0.0333, 0.0615]
    t2m: [-2.5985455071070955, 13.613745769755358]
    msl: [101261.65922657882, 1112.7187312302365]
    u10: [0.6010106010949151, 4.545559141871505]
    v10: [-0.2104646166032582, 4.707062023219409]
    dSIC_M: [0.0, 0.1]
    dSIT_M: [0.0, 0.08]
    dSIC_H: [0.0, 0.05]
  # one Swin U-Net per generator; G_M / G_H run on 128^2 / 256^2 crops
  swin:
    C: ${swin_config}
    M: ${swin_config_fine}
    H: ${swin_config_fine}
  d: 32            # encoder / pyramid feature size
  d_psi: 4         # latent sub-grid residual psi_C
  n_up_queries: 4  # K queries of Pi^up
  raw_days: 3      # last days of gridded CIMR given uncompressed to G_C (0: none)
  smooth_cond: true  # Pi^down and the snow channel of G_H interpolated, not injected
  corrector: true    # G_M / G_H correct the prolonged coarser sample (no R dX = 0)
  lambda_in: 0.3     # weight of the day-t ASIP of Y^in as fine targets (corrector only)
  advect_window: false  # move the observation window to day t along a learned free drift (v7)
  drift_init: [0.015, 15.0]  # free drift: alpha (ice / wind speed), theta (deg to the right)
  p_null: 0.1      # context-group dropout (guidance)
  eta: 0.05        # noise on the coarse conditioning (normalised units)
  lambda_s: 1.0
  lambda_c: 0.1
  lambda_cyc_sit: 0.0  # SIT texture: within-C-cell std of the one-step SIT at M vs sit_std of S_C (v7: 0.1)
  lambda_psi: 0.01
  lambda_perp: 1.0
  cyc_tau: 0.05    # width of the soft S_C indicators in L_cyc
  cond_steps: 6    # Heun steps of the EMA coarse samples used as conditioning
  lr: 1e-4
  betas: [0.9, 0.995]
  lr_scheduler_start_factor: 1e-5
  lr_scheduler_iters: 20000
  ema_decay: 0.999
  n_steps: 20
  n_members: 8
  score_every: 5
  n_score_batches: 20

swin_config:
  base_dim: 128
  encoder_depths: [2, 2, 18, 2]
  decoder_depths: [6, 2, 2]
  num_heads: [2, 4, 8, 16]
  window_size: 8
  mlp_ratio: 2.0
  time_dim: 512
  modulation_rank: 128
  drop_path_rate: 0.1
  activation_checkpointing: True

swin_config_fine:
  base_dim: 64
  encoder_depths: [2, 2, 6, 2]
  decoder_depths: [2, 2, 2]
  num_heads: [2, 4, 8, 16]
  window_size: 8
  mlp_ratio: 2.0
  time_dim: 256
  modulation_rank: 64
  drop_path_rate: 0.1
  activation_checkpointing: True

entrypoints:
  - _target_: croscim.train.base_training
    trainer: ${trainer}
    lit_mod: ${model}
    dm: ${datamodule}
    ckpt: null
    init_weights_ckpt: null
    save_dir: ${paths.src}/results
