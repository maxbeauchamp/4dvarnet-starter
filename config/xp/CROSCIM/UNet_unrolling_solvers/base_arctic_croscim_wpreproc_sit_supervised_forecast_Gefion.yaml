# @package _global_
# Gefion adaptation of base_arctic_croscim_wpreproc_sit_supervised_forecast.yaml
# Paths, trainer (SLURM/multi-node) and dataloader settings updated for Gefion.

paths:
  src: /dcai/users/beamax
  preproc: /dcai/projects/cu_0026/croscim_train

domain: ???

# ===== CENTRALIZED VARIABLE CONFIGURATION =====
var_config:
  # Satellite variables by source
  satellite_vars:
    cristal: ["SIT"]
    cimr: ["SIT","SIC"]
    asip: ["sic"]
  
  # Numerical model variables
  models_vars: null #["SIT"]
  
  # Atmospheric covariates (reduced since some moved to models)
  covariates: ["t2m", "msl", "u10", "v10"]
  
  # Target variables
  target_vars:
    patch_x50:
      - models_SIT 
    patch_x10:
      - models_SIT

  # Mapping: which input variable initializes which target
  var_mapping:
    patch_x50:
      models_SIT: cristal_SIT 
    patch_x10:
      models_SIT: cristal_SIT
  
  # Time steps per resolution 
  time_steps:
    patch_x50: 15
    patch_x10: 8

# ===== COMPUTED VARIABLES (using OmegaConf interpolation) =====
computed:
  # Flatten satellite vars: ['asip_sic', 'cimr_SIC', 'cimr_SIT', 'cristal_SIT', 'cristal_SSH']
  input_vars_satellite: ${python_eval:"[f'{source}_{var}' for source, vars in ${var_config.satellite_vars}.items() for var in vars]"}
  
  # Add model vars with prefix: ['models_t2m', 'models_msl', 'models_sic', 'models_sit']
  input_vars_models: ${python_eval:"[f'models_{var}' for var in ${var_config.models_vars}]"}
  
  # Combine all inputs: satellite + models + covariates
  input_vars_all: ${python_eval:"${computed.input_vars_satellite} + ${var_config.covariates}"}

trainer:
  _target_: pytorch_lightning.Trainer
  inference_mode: False
  gradient_clip_val: 0.5
  accelerator: gpu
  devices: ${oc.decode:${oc.env:SLURM_GPUS_ON_NODE,8}}
  num_nodes: ${oc.decode:${oc.env:SLURM_NNODES,1}}
  strategy:
    _target_: pytorch_lightning.strategies.DDPStrategy
    find_unused_parameters: True
  plugins:
    - _target_: pytorch_lightning.plugins.environments.SLURMEnvironment
      auto_requeue: false
  accumulate_grad_batches: 2
  limit_train_batches: 1000.
  limit_val_batches: 500.
  max_epochs: 500
  precision: bf16-mixed
  logger:
    _target_: pytorch_lightning.loggers.CSVLogger
    save_dir: ${hydra:runtime.output_dir}
    name: ${hydra:runtime.choices.xp}
    version: ''
  callbacks:
    - _target_: pytorch_lightning.callbacks.LearningRateMonitor
    - _target_: pytorch_lightning.callbacks.ModelCheckpoint
      monitor: val_loss
      save_top_k: 3
      save_last: true
      filename: 'Unrolling-{val_loss:.5f}-{epoch:03d}'

datamodule:
  _target_: contrib.CROSCIM.dataloaders.data_simple_multires_supervised.BaseDataModuleMultiResSupervised_simplify
  
  # Variable configuration
  satellite_vars: ${var_config.satellite_vars}
  models_vars: ${var_config.models_vars}
  covariates: ${var_config.covariates}
  target_vars: ${var_config.target_vars}
  var_mapping: ${var_config.var_mapping} 
  # Preprocessed data paths
  croscim_preproc_paths:
    patch_x2: ${paths.preproc}/preproc_CROSCIM_x2.nc
    patch_x10: ${paths.preproc}/preproc_CROSCIM_x10.nc
    patch_x50: ${paths.preproc}/preproc_CROSCIM_x50.nc  
  # Multi-resolution configuration
  multires: [50,10]
  # Data splits
  split_train: {_target_: builtins.slice, _args_: [0, 2000]}
  split_val: {_target_: builtins.slice, _args_: [2000, 2050]}
  split_test: {_target_: builtins.slice, _args_: [2000,2050]}
  dl_kw: {batch_size: 2, num_workers: 20}
  norm_stats:
    asip:
      sic: {min: 0.0, max: 100.0, type: minmax}
      standard_deviation_sic: {mean: 1.8761531586097209, std: 4.922335431544444, type: zscore}
      status_flag: {min: 0.0, max: 1536.0, type: minmax}
    cimr:
      SIC: {min: 0.0, max: 1.0, type: minmax}
      SIT: {mean: 0.5695980677516013, std: 0.8216149733058172, type: zscore}
      Tsurf: {mean: -6.3703807274976665, std: 9.394544766238061, type: zscore}
    cristal:
      HS: {mean: 0.15517908473300512, std: 0.13962813089282153, type: zscore}
      SIT: {mean: 0.5695980677516013, std: 0.8216149733058172, type: zscore}
      SSH: {mean: 0.1912636630889516, std: 0.41697635927509086, type: zscore}
  norm_stats_models:
    SIC: {min: 0.0, max: 1.0, type: minmax}
    SIT: {mean: 0.5695980677516013, std: 0.8216149733058172, type: zscore}
    HS: {mean: 0.06844576249551623, std: 0.1137041260225963, type: zscore}
    SSH: {mean: 0.21988234269231605, std: 0.2757902493660287, type: zscore}
  norm_stats_covs:
    msl: {mean: 101261.65922657882, std: 1112.7187312302365, type: zscore}
    t2m: {mean: -2.5985455071070955, std: 13.613745769755358, type: zscore}
    u10: {mean: 0.6010106010949151, std: 4.545559141871505, type: zscore}
    v10: {mean: -0.2104646166032582, std: 4.707062023219409, type: zscore}
    tcc: {min: 1.0896958883677144e-05, max: 0.024753304198384285, type: minmax}
    d2m: {mean: 2.4095910147380064e-08, std: 4.900962447374831e-08, type: zscore}
    ssrd: {mean: 95.72918023746189, std: 93.44316534428312, type: zscore}
    strd: {mean: 265.25246499467744, std: 63.12553499850183, type: zscore}
    tp: {mean: 2.4095910147380064e-08, std: 4.900962447374831e-08, type: zscore}

model:
  _target_: contrib.CROSCIM.models.models_supervised.Lit4dVarNet_CROSCIM_Supervised 
  persist_rw: False
  multires: [50,10]
  normalize_anomaly: false
  opt_fn: null
  # Variable configuration
  tgt_vars: ${var_config.target_vars}
  satellite_vars: ${var_config.satellite_vars}
  covariates: ${var_config.covariates}
  models_vars: ${var_config.models_vars} 
  var_mapping: ${var_config.var_mapping}
  
  domain_limits: {xc: {_target_: builtins.slice, _args_: [-3849750., 3749750.]},
                  yc: {_target_: builtins.slice, _args_: [2473750., -4896250.]}}
  rec_weight: ${optim_weight}
  optim_weight: ${optim_weight}
  prior_weight: ${optim_weight}
  frcst_lead: 2
  solver:
    _target_: contrib.CROSCIM.solvers.solver_expanded.GradSolvers
    solvers:
      solver_x50:
        _target_: contrib.CROSCIM.solvers.solver_expanded.GradSolver
        n_step: 10
        lr_grad: 0.2
        input_grad_update: 'grad'
        input_vars: ${computed.input_vars_all}
        target_vars: ${var_config.target_vars.patch_x50}
        var_mapping: ${var_config.var_mapping.patch_x50}
        n_time: ${var_config.time_steps.patch_x50}
        obs_cost:
          _target_: contrib.CROSCIM.solvers.solver_expanded.BaseObsCost
          w: 1.0
          use_target: true
        prior_cost:
          _target_: contrib.CROSCIM.solvers.solver_expanded.BilinAEPriorCost
          dim_in: ${python_eval:"len(${computed.input_vars_all}) * ${var_config.time_steps.patch_x50}"}
          dim_hidden: 180
          dim_out: ${python_eval:"len(${var_config.target_vars.patch_x50}) * ${var_config.time_steps.patch_x50}"}
        grad_mod:
          _target_: contrib.CROSCIM.solvers.solver_expanded.GradModelWithCondition
          use_grad_norm: true
          grad_model:
            _target_: contrib.CROSCIM.solvers.UNet_OAI.UNetModel2
            in_channels: ${python_eval:"len(${var_config.target_vars.patch_x50}) * ${var_config.time_steps.patch_x50}"}
            out_channels: ${python_eval:"len(${var_config.target_vars.patch_x50}) * ${var_config.time_steps.patch_x50}"}
            model_channels: 32
            num_res_blocks: 1
            channel_mult:
            - 1
            - 2
            attention_resolutions: []
            use_checkpoint: true
            dropout: 0.1
            bias: false
            interp_mode: bilinear
        fill_missing_inp: false
      solver_x10:
        _target_: contrib.CROSCIM.solvers.solver_expanded.GradSolver
        n_step: 10
        lr_grad: 0.2
        input_grad_update: 'grad'
        input_vars: ${computed.input_vars_all}
        target_vars: ${var_config.target_vars.patch_x10}
        var_mapping: ${var_config.var_mapping.patch_x10}
        n_time: ${var_config.time_steps.patch_x10}
        obs_cost:
          _target_: contrib.CROSCIM.solvers.solver_expanded.BaseObsCost
          w: 1.0
          use_target: true
        prior_cost:
          _target_: contrib.CROSCIM.solvers.solver_expanded.BilinAEPriorCost
          dim_in: ${python_eval:"len(${computed.input_vars_all}) * ${var_config.time_steps.patch_x10}"}
          dim_hidden: 180
          dim_out: ${python_eval:"len(${var_config.target_vars.patch_x10}) * ${var_config.time_steps.patch_x10}"}
        grad_mod:
          _target_: contrib.CROSCIM.solvers.solver_expanded.GradModelWithCondition
          use_grad_norm: true
          grad_model:
            _target_: contrib.CROSCIM.solvers.UNet_OAI.UNetModel2
            in_channels: ${python_eval:"len(${var_config.target_vars.patch_x10}) * ${var_config.time_steps.patch_x10}"}
            out_channels: ${python_eval:"len(${var_config.target_vars.patch_x10}) * ${var_config.time_steps.patch_x10}"}
            model_channels: 32
            num_res_blocks: 1
            channel_mult:
            - 1
            - 2
            attention_resolutions: []
            use_checkpoint: true
            dropout: 0.1
            bias: false
            interp_mode: bilinear
        fill_missing_inp: false
  norm_stats: ${datamodule.norm_stats}
  norm_stats_covs: ${datamodule.norm_stats_covs}
  norm_stats_models: ${datamodule.norm_stats_models} 

optim_weight:
  patch_x50:
    _target_: src.utils.get_uniform_time_wei
    patch_dims: {time: 15, yc: 256, xc: 256}
    crop: {time: 0, yc: 28, xc: 28}
    offset: 1
    dim_order: ["time", "yc", "xc"]
  patch_x10:
    _target_: src.utils.get_linear_time_wei
    patch_dims: {time: 8, yc: 256, xc: 256}
    crop: {time: 0, yc: 28, xc: 28}
    offset: 1
    dim_order: ["time", "yc", "xc"]

metrics:
  nrmse_scores: {_target_: src.utils.rmse_based_scores_from_ds, _partial_: True}
  psd_scores: {_target_: src.utils.psd_based_scores_from_ds, _partial_: True}
  get0: {_target_: operator.itemgetter, _args_: [0]}
  get1: {_target_: operator.itemgetter, _args_: [1]}
  test_metrics:
    mu: {_target_: src.utils.pipe, _partial_: true, fns: ['${metrics.nrmse_scores}', '${metrics.get0}']}
    sig: {_target_: src.utils.pipe, _partial_: true, fns: ['${metrics.nrmse_scores}', '${metrics.get1}']}
    lx: {_target_: src.utils.pipe, _partial_: true, fns: ['${metrics.psd_scores}', '${metrics.get0}']}
    lt: {_target_: src.utils.pipe, _partial_: true, fns: ['${metrics.psd_scores}', '${metrics.get1}']}

entrypoints:
  - _target_: src.train.base_training
    trainer: ${trainer}
    lit_mod: ${model}
    dm: ${datamodule}
    #ckpt: ${paths.src}/4dvarnet-starter/ckpt/CROSCIM/base_croscim_UNet_unrolling_sit_supervised_forecast.ckpt
    save_dir: ${paths.src}/results

defaults:
  - /domain: arctic_croscim
