# @package _global_

paths:
  src: /dmidata/users/maxb
  mask: /dmidata/users/maxb/4dvarnet-starter/contrib/CROSCIM/mask_PanArctic.nc

domain: ???

# ===== CENTRALIZED VARIABLE CONFIGURATION =====
var_config:
  # Satellite variables by source
  satellite_vars:
    cimr: ["SIC", "SIT"]
    cristal: ["SIT", "SSH"]
    asip: ["sic"]
  
  # Atmospheric covariates
  covariates: ["msl", "t2m", "u10", "v10"]
  
  # Target variables
  target_vars: ["tgt_sic", "tgt_SIT"]
  
  # Mapping: which input variable initializes which target
  var_mapping:
    tgt_sic: asip_sic    # Target SIC initialized from ASIP SIC
    tgt_SIT: cimr_SIT    # Target SIT initialized from CIMR SIT
  
  # Time steps per resolution
  time_steps:
    patch_x2: 5
    patch_x10: 10
    patch_x50: 15

# ===== COMPUTED VARIABLES (using OmegaConf interpolation) =====
# Automatically construct input_vars from satellite_vars + covariates
computed:
  # Flatten satellite vars: ['asip_sic', 'cimr_SIC', 'cimr_SIT', 'cristal_SIT', 'cristal_SSH']
  input_vars_satellite: ${python_eval:"[f'{source}_{var}' for source, vars in ${var_config.satellite_vars}.items() for var in vars]"}
  
  # Combine with covariates
  input_vars_all: ${python_eval:"${computed.input_vars_satellite} + ${var_config.covariates}"}

trainer:
  _target_: pytorch_lightning.Trainer
  inference_mode: False
  gradient_clip_val: 0.5
  accelerator: gpu
  devices: 1
  accumulate_grad_batches: 10
  limit_train_batches: 1000.
  limit_val_batches: 500.
  max_epochs: 150
  logger:
    _target_: pytorch_lightning.loggers.CSVLogger
    save_dir: ${hydra:runtime.output_dir}
    name: ${hydra:runtime.choices.xp}
    version: ''
  callbacks:
    - _target_: pytorch_lightning.callbacks.LearningRateMonitor
    - _target_: pytorch_lightning.callbacks.ModelCheckpoint
      monitor: val_mse
      save_top_k: 3
      filename: '{val_mse:.5f}-{epoch:03d}'

datamodule:
  _target_: contrib.CROSCIM.dataloaders.data_multires.BaseDataModuleMultiRes
  
  # Variable configuration
  satellite_vars: ${var_config.satellite_vars}
  covariates: ${var_config.covariates}
  target_vars: ${var_config.target_vars}
  var_mapping: ${var_config.var_mapping}
  
  # Data paths - using load_data.py's get_paths_for_source
  asip_paths:
    _target_: contrib.CROSCIM.load_data.get_paths_for_source
    source: asip
    paths: ${paths}
  cimr_paths:
    _target_: contrib.CROSCIM.load_data.get_paths_for_source
    source: cimr
    paths: ${paths}
  cristal_paths:
    _target_: contrib.CROSCIM.load_data.get_paths_for_source
    source: cristal
    paths: ${paths}
  covariates_paths:
    _target_: contrib.CROSCIM.load_data.get_paths_for_source
    source: covariates
    paths: ${paths}
  mask_path: ${paths.mask}
  domain_name: arctic_croscim
  domains:
    train:
      time: {_target_: builtins.slice, _args_: ['2022-05-01', '2022-12-31']}
    val:
      time:
        - {_target_: builtins.slice, _args_: ['2022-05-01', '2022-06-30']}
        - {_target_: builtins.slice, _args_: ['2022-07-01', '2022-12-31']}
    test:
      time: {_target_: builtins.slice, _args_: ['2022-02-01', '2022-02-15']}
  xrds_kw:
    patch_dims: { time: 15, yc: 256, xc: 256}
    strides: { time: 1, yc: 28, xc: 28}
    strides_test: {time: 1, yc: 200, xc: 200}
    domain_limits: {xc: {_target_: builtins.slice, _args_: [-3849750., 3749750.]},
                    yc: {_target_: builtins.slice, _args_: [2473750., -4896250.]}}
  dl_kw: {batch_size: 2, num_workers: 20}
  res: 500
  pads: [False, False, True]
  norm_stats:
    asip:
      sic: {min: 0.0, max: 100.0, type: minmax}
      standard_deviation_sic: {mean: 1.8761531586097209, std: 4.922335431544444, type: zscore}
      status_flag: {min: 0.0, max: 1536.0, type: minmax}
    cimr:
      SIC: {min: 0.0, max: 1.0, type: minmax}
      SIT: {mean: 0.02392856443828687, std: 0.08694672390807144, type: zscore}
      Tsurf: {mean: -6.3703807274976665, std: 9.394544766238061, type: zscore}
    cristal:
      HS: {mean: 0.15517908473300512, std: 0.13962813089282153, type: zscore}
      SIT: {mean: 1.3583107984977745, std: 0.7628621685375375, type: zscore}
      SSH: {mean: 0.1912636630889516, std: 0.41697635927509086, type: zscore}
  norm_stats_covs:
    msl: {mean: 101261.65922657882, std: 1112.7187312302365, type: zscore}
    t2m: {mean: -2.5985455071070955, std: 13.613745769755358, type: zscore}
    u10: {mean: 0.6010106010949151, std: 4.545559141871505, type: zscore}
    v10: {mean: -0.2104646166032582, std: 4.707062023219409, type: zscore}
    tcc: {min: 1.0896958883677144e-05, max: 0.024753304198384285, type: minmax}
    d2m: {mean: 2.4095910147380064e-08, std: 4.900962447374831e-08, type: zscore}
    ssrd: {mean: 95.72918023746189, std: 93.44316534428312, type: zscore}
    strd: {mean: 265.25246499467744, std: 63.12553499850183, type: zscore}
    tp: {mean: 2.4095910147380064e-08, std: 4.900962447374831e-08, type: zscore}
  multires: [50, 10, 2]

model:
  _target_: contrib.CROSCIM.models.Lit4dVarNet_CROSCIM
  persist_rw: False
  multires: [50, 10, 2]
  opt_fn: null
  # Variable configuration
  tgt_vars: ${var_config.target_vars}
  satellite_vars: ${var_config.satellite_vars}
  covariates: ${var_config.covariates}
  var_mapping: ${var_config.var_mapping}
  
  domain_limits: {xc: {_target_: builtins.slice, _args_: [-3849750., 3749750.]},
                  yc: {_target_: builtins.slice, _args_: [2473750., -4896250.]}}
  rec_weight: ${optim_weight}
  optim_weight: ${optim_weight}
  prior_weight: ${optim_weight}
  frcst_lead: 0
  solver:
    _target_: contrib.CROSCIM.solver.GradSolvers
    solvers:
      solver_x2:
        _target_: contrib.CROSCIM.UNet.UNetSolver
        n_channels: ${python_eval:"len(${computed.input_vars_all}) * ${var_config.time_steps.patch_x2}"}
        n_hidden: 90
        n_classes: ${python_eval:"len(${var_config.target_vars}) * ${var_config.time_steps.patch_x2}"}
      solver_x10:
        _target_: contrib.CROSCIM.UNet.UNetSolver
        n_channels: ${python_eval:"len(${computed.input_vars_all}) * ${var_config.time_steps.patch_x10}"}
        n_hidden: 120
        n_classes: ${python_eval:"len(${var_config.target_vars}) * ${var_config.time_steps.patch_x10}"}
      solver_x50:
        _target_: contrib.CROSCIM.UNet.UNetSolver
        n_channels: ${python_eval:"len(${computed.input_vars_all}) * ${var_config.time_steps.patch_x50}"}
        n_hidden: 180
        n_classes: ${python_eval:"len(${var_config.target_vars}) * ${var_config.time_steps.patch_x50}"}
  norm_stats: ${datamodule.norm_stats}
  norm_stats_covs: ${datamodule.norm_stats_covs}

optim_weight:
  patch_x2:
    _target_: src.utils.get_linear_time_wei
    patch_dims: {time: 5, yc: 256, xc: 256}
    crop: {time: 0, yc: 28, xc: 28}
    offset: 1
    dim_order: ["time", "yc", "xc"]
  patch_x10:
    _target_: src.utils.get_linear_time_wei
    patch_dims: {time: 10, yc: 256, xc: 256}
    crop: {time: 0, yc: 28, xc: 28}
    offset: 1
    dim_order: ["time", "yc", "xc"]
  patch_x50:
    _target_: src.utils.get_linear_time_wei
    patch_dims: {time: 15, yc: 256, xc: 256}
    crop: {time: 0, yc: 28, xc: 28}
    offset: 1
    dim_order: ["time", "yc", "xc"]

metrics:
  nrmse_scores: {_target_: src.utils.rmse_based_scores_from_ds, _partial_: True}
  psd_scores: {_target_: src.utils.psd_based_scores_from_ds, _partial_: True}
  get0: {_target_: operator.itemgetter, _args_: [0]}
  get1: {_target_: operator.itemgetter, _args_: [1]}
  test_metrics:
    mu: {_target_: src.utils.pipe, _partial_: true, fns: ['${metrics.nrmse_scores}', '${metrics.get0}']}
    sig: {_target_: src.utils.pipe, _partial_: true, fns: ['${metrics.nrmse_scores}', '${metrics.get1}']}
    lx: {_target_: src.utils.pipe, _partial_: true, fns: ['${metrics.psd_scores}', '${metrics.get0}']}
    lt: {_target_: src.utils.pipe, _partial_: true, fns: ['${metrics.psd_scores}', '${metrics.get1}']}

entrypoints:
  - _target_: src.train.base_training
    trainer: ${trainer}
    lit_mod: ${model}
    dm: ${datamodule}
    save_dir: ${paths.src}/results

defaults:
  - /domain: arctic_croscim

