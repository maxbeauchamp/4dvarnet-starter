# @package _global_

paths:
  src: /dmidata/users/maxb
  preproc: /dmidata/users/maxb/PREPROC

domain: ???

# ===== CENTRALIZED VARIABLE CONFIGURATION =====
var_config:
  # Satellite variables by source
  satellite_vars:
    cristal: ["SIT"]
    cimr: ["SIT","SIC"]
    asip: ["sic"]
  
  # Numerical model variables
  models_vars: null #["SIT"]
  
  # Atmospheric covariates (reduced since some moved to models)
  covariates: ["t2m", "msl", "u10", "v10"]
  
  # Target variables
  #target_vars: ["tgt_sit"]
  target_vars:
    patch_x50:
      # Low resolution: use model outputs as targets
      - models_SIT 
      - models_SIC
    patch_x10:
      - models_SIT
      - models_SIC
    patch_x2:
      - models_SIT
      - tgt_SIC

  # Mapping: which input variable initializes which target
  var_mapping:
    patch_x50:
      # Low resolution: use model outputs as targets
      #tgt_sit: models_SIT
      models_SIT: cristal_SIT 
      models_SIC: cimr_SIC
    patch_x10:
      models_SIT: cristal_SIT
      models_SIC: cimr_SIC
    patch_x2:
      models_SIT: cristal_SIT
      tgt_SIC: asip_sic
  
  # Time steps per resolution 
  time_steps:
    patch_x50: 15
    patch_x10: 10
    patch_x2: 5


# ===== COMPUTED VARIABLES (using OmegaConf interpolation) =====
computed:
  # Flatten satellite vars: ['asip_sic', 'cimr_SIC', 'cimr_SIT', 'cristal_SIT', 'cristal_SSH']
  input_vars_satellite: ${python_eval:"[f'{source}_{var}' for source, vars in ${var_config.satellite_vars}.items() for var in vars]"}
  
  # Add model vars with prefix: ['models_t2m', 'models_msl', 'models_sic', 'models_sit']
  input_vars_models: ${python_eval:"[f'models_{var}' for var in ${var_config.models_vars}]"}
  
  # Combine all inputs: satellite + models + covariates
  input_vars_all: ${python_eval:"${computed.input_vars_satellite} + ${var_config.covariates}"}

trainer:
  _target_: pytorch_lightning.Trainer
  inference_mode: False
  gradient_clip_val: 0.5
  accelerator: gpu
  devices: 1
  accumulate_grad_batches: 10
  limit_train_batches: 1000.
  limit_val_batches: 500.
  max_epochs: 3
  logger:
    _target_: pytorch_lightning.loggers.CSVLogger
    save_dir: ${hydra:runtime.output_dir}
    name: ${hydra:runtime.choices.xp}
    version: ''
  callbacks:
    - _target_: pytorch_lightning.callbacks.LearningRateMonitor
    - _target_: pytorch_lightning.callbacks.ModelCheckpoint
      monitor: val_loss
      save_top_k: 3
      filename: '{val_loss:.5f}-{epoch:03d}'

datamodule:
  _target_: contrib.CROSCIM.dataloaders.data_simple_multires_supervised.BaseDataModuleMultiResSupervised_simplify
  
  # Variable configuration
  satellite_vars: ${var_config.satellite_vars}
  models_vars: ${var_config.models_vars}
  covariates: ${var_config.covariates}
  target_vars: ${var_config.target_vars}
  var_mapping: ${var_config.var_mapping} 
  # Preprocessed data paths
  croscim_preproc_paths:
    patch_x2: ${paths.preproc}/preproc_CROSCIM_x2.nc
    patch_x10: ${paths.preproc}/preproc_CROSCIM_x10.nc
    patch_x50: ${paths.preproc}/preproc_CROSCIM_x50.nc
  
  # Multi-resolution configuration
  multires: [50,10,2]
  
  # Data splits
  split_train: {_target_: builtins.slice, _args_: [0, 60]}
  split_val: {_target_: builtins.slice, _args_: [60, 61]}
  split_test: {_target_: builtins.slice, _args_: [30,35]}

  norm_stats:
    asip:
      sic: {min: 0.0, max: 100.0, type: minmax}
      standard_deviation_sic: {mean: 1.952899634621331, std: 4.922985470259985, type: zscore}
      status_flag: {min: 0.0, max: 1536.0, type: minmax}
    cimr:
      SIC: {min: -0.049950417409564574, max: 1.0498479215517267, type: minmax}
      SIT: {mean: 0.09544839558401243, std: 0.13231399596810897, type: zscore}
      Tsurf: {mean: -7.098038910302271, std: 9.410905679026854, type: zscore}
    cristal:
      HS: {mean: 0.15701109538657623, std: 0.14167074971036836, type: zscore}
      SIT: {mean: 1.713899766845625, std: 1.0358012026065266, type: zscore}
      SSH: {mean: 0.36872446726198005, std: 0.3961191636146796, type: zscore}
  norm_stats_models:
    SIC: {min: -0.049950417409564574, max: 1.0498479215517267, type: minmax}
    SIT: {mean: 0.09544839558401243, std: 0.13231399596810897, type: zscore}
    HS: {mean: 0.15701109538657623, std: 0.14167074971036836, type: zscore}
    SSH: {mean: 0.36872446726198005, std: 0.3961191636146796, type: zscore}
  norm_stats_covs:
    t2m: {mean: 271.533815513639, std: 14.303287836457294, type: zscore}
    msl: {mean: 101397.28559169156, std: 1178.6647666762826, type: zscore}
    u10: {mean: 0.5536510314408732, std: 4.341491519336185, type: zscore}
    v10: {mean: 0.031581173569483305, std: 4.287231013697467, type: zscore}
    tcc: {min: 0.0, max: 1.0, type: minmax}
    d2m: {mean: 268.22918333426907, std: 13.96055261063253, type: zscore}
    ssrd: {mean: -701143.5402508647, std: 785444.8336077137, type: zscore}
    strd: {mean: -1943008.2121575351, std: 466464.69271380285, type: zscore}
    tp: {mean: -0.0001834410365694742, std: 0.0005019462438424605, type: zscore}

model:
  _target_: contrib.CROSCIM.models_supervised.Lit4dVarNet_CROSCIM_Supervised 
  persist_rw: False
  multires: [50,10,2]
  opt_fn: null
  # Variable configuration
  tgt_vars: ${var_config.target_vars}
  satellite_vars: ${var_config.satellite_vars}
  covariates: ${var_config.covariates}
  models_vars: ${var_config.models_vars} 
  var_mapping: ${var_config.var_mapping}
  
  domain_limits: {xc: {_target_: builtins.slice, _args_: [-3849750., 3749750.]},
                  yc: {_target_: builtins.slice, _args_: [2473750., -4896250.]}}
  rec_weight: ${optim_weight}
  optim_weight: ${optim_weight}
  prior_weight: ${optim_weight}
  frcst_lead: 0
  solver:
    _target_: contrib.CROSCIM.solver.GradSolvers
    solvers:
      solver_x50:
        _target_: contrib.CROSCIM.UNet.UNetSolver
        n_channels: ${python_eval:"len(${computed.input_vars_all}) * ${var_config.time_steps.patch_x50}"}
        n_hidden: 180
        n_classes: ${python_eval:"len(${var_config.target_vars.patch_x50}) * ${var_config.time_steps.patch_x50}"}
      solver_x10:
        _target_: contrib.CROSCIM.UNet.UNetSolver
        n_channels: ${python_eval:"len(${computed.input_vars_all}) * ${var_config.time_steps.patch_x10}"}
        n_hidden: 180
        n_classes: ${python_eval:"len(${var_config.target_vars.patch_x10}) * ${var_config.time_steps.patch_x10}"}
      solver_x2:
        _target_: contrib.CROSCIM.UNet.UNetSolver
        n_channels: ${python_eval:"len(${computed.input_vars_all}) * ${var_config.time_steps.patch_x2}"}
        n_hidden: 180
        n_classes: ${python_eval:"len(${var_config.target_vars.patch_x2}) * ${var_config.time_steps.patch_x2}"}
  norm_stats: ${datamodule.norm_stats}
  norm_stats_covs: ${datamodule.norm_stats_covs}
  norm_stats_models: ${datamodule.norm_stats_models} 

optim_weight:
  patch_x50:
    _target_: src.utils.get_linear_time_wei
    patch_dims: {time: 15, yc: 256, xc: 256}
    crop: {time: 0, yc: 28, xc: 28}
    offset: 1
    dim_order: ["time", "yc", "xc"]
  patch_x10:
    _target_: src.utils.get_linear_time_wei
    patch_dims: {time: 10, yc: 256, xc: 256}
    crop: {time: 0, yc: 28, xc: 28}
    offset: 1
    dim_order: ["time", "yc", "xc"]
  patch_x2:
    _target_: src.utils.get_linear_time_wei
    patch_dims: {time: 5, yc: 256, xc: 256}
    crop: {time: 0, yc: 28, xc: 28}
    offset: 1
    dim_order: ["time", "yc", "xc"]

metrics:
  nrmse_scores: {_target_: src.utils.rmse_based_scores_from_ds, _partial_: True}
  psd_scores: {_target_: src.utils.psd_based_scores_from_ds, _partial_: True}
  get0: {_target_: operator.itemgetter, _args_: [0]}
  get1: {_target_: operator.itemgetter, _args_: [1]}
  test_metrics:
    mu: {_target_: src.utils.pipe, _partial_: true, fns: ['${metrics.nrmse_scores}', '${metrics.get0}']}
    sig: {_target_: src.utils.pipe, _partial_: true, fns: ['${metrics.nrmse_scores}', '${metrics.get1}']}
    lx: {_target_: src.utils.pipe, _partial_: true, fns: ['${metrics.psd_scores}', '${metrics.get0}']}
    lt: {_target_: src.utils.pipe, _partial_: true, fns: ['${metrics.psd_scores}', '${metrics.get1}']}

entrypoints:
  - _target_: src.train.base_training
    trainer: ${trainer}
    lit_mod: ${model}
    dm: ${datamodule}
    save_dir: ${paths.src}/results

defaults:
  - /domain: arctic_croscim