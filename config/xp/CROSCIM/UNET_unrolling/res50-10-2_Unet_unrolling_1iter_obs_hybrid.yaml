# @package _global_

paths:
  src: /Odyssey/private/p25denai/CROSCIM
  preproc: /Odyssey/private/m19beauc/CROSCIM_dataset/croscim_train

ckpt: /Odyssey/private/p25denai/CROSCIM/results/2025-12-17/13:25:11/CROSCIM/4DVarNet_solvers/base_arctic_croscim_wpreproc_sic_res50_4dvarNetConvLSTM/checkpoints/val_loss=0.03194-epoch=097.ckpt
config_path:  /Odyssey/private/p25denai/CROSCIM/results/2025-12-17/13:25:11/.hydra/config.yaml



hydra:
  run:
    dir: ${paths.src}/results/${now:%Y-%m-%d}/${now:%H:%M:%S}

xp_name: ${last:${hydra:runtime.choices.xp}}

domain: ???

# ===== CENTRALIZED VARIABLE CONFIGURATION =====
var_config:
  # Satellite variables by source
  satellite_vars:
    #cimr: ["SIC", "SIT", "Tsurf", "SICnoise", "SITnoise", "Tsurfnoise"],
    #cristal: ["HS", "SIT", "SSH", "HSnoise", "SITnoise", "SSHnoise"],
    #asip: ["sic", "standard_deviation_sic", "status_flag"]
    cimr: ["SIC"]
    asip: ["sic"]
  
  # Atmospheric covariates
  #covariates: ["msl", "t2m", "u10", "v10", "tcc", "d2m", "ssrd", "strd", "tp"]
  covariates: ["msl", "t2m", "u10", "v10"]
  
  # Target variables
  target_vars: ["tgt_sic"]
  
  # Mapping: which input variable initializes which target
  # Format: {target_var: source_var}
  var_mapping:
    tgt_sic: asip_sic    # Target SIC initialized from ASIP SIC
  
  # Time steps per resolution
  time_steps:
    patch_x50: 15
    patch_x10: 10
    patch_x2: 5

# ===== COMPUTED VARIABLES (using OmegaConf interpolation) =====
# Automatically construct input_vars from satellite_vars + covariates
computed:
  # Flatten satellite vars: ['asip_sic', 'cimr_SIC', 'cimr_SIT', 'cristal_SIT', 'cristal_SSH']
  input_vars_satellite: ${python_eval:"[f'{source}_{var}' for source, vars in ${var_config.satellite_vars}.items() for var in vars]"}
  
  # Combine with covariates
  input_vars_all: ${python_eval:"${computed.input_vars_satellite} + ${var_config.covariates}"}


trainer:
  _target_: pytorch_lightning.Trainer
  inference_mode: False
  #gradient_clip_val: 0.5
  accelerator: gpu
  devices: 1
  accumulate_grad_batches: 20
  limit_train_batches: 500
  limit_val_batches: 50.
  limit_test_batches: 50.
  max_epochs: 100
  logger:
    _target_: pytorch_lightning.loggers.tensorboard.TensorBoardLogger
    save_dir: ${hydra:runtime.output_dir}
    name: ${xp_name}
    version: ''
  callbacks:
    - _target_: pytorch_lightning.callbacks.LearningRateMonitor
    - _target_: pytorch_lightning.callbacks.ModelCheckpoint
      monitor: val_loss
      save_top_k: 3
      filename: '{val_loss:.5f}-{epoch:03d}'
    - _target_: pytorch_lightning.callbacks.RichProgressBar
      leave: True
    - _target_: pytorch_lightning.callbacks.RichModelSummary
      max_depth: 2

datamodule:
  _target_: contrib.CROSCIM.data_simple_multires.BaseDataModuleMultiRes_simplify
  
  # Variable configuration
  satellite_vars: ${var_config.satellite_vars}
  covariates: ${var_config.covariates}
  target_vars: ${var_config.target_vars}
  var_mapping: ${var_config.var_mapping}

  # Preprocessed data paths
  croscim_preproc_paths:
    patch_x2: ${paths.preproc}/preproc_CROSCIM_x2.nc
    patch_x10: ${paths.preproc}/preproc_CROSCIM_x10.nc
    patch_x50: ${paths.preproc}/preproc_CROSCIM_x50.nc
  
  # Multi-resolution configuration
  multires: [50, 10, 2]
  
  # Data splits
  split_train: {_target_: builtins.slice, _args_: [0, 1450]}
  split_val: {_target_: builtins.slice, _args_: [1450, 1490]}
  split_test: {_target_: builtins.slice, _args_: [1490, 1500]}
  
  # Normalization statistics for satellite variables
  norm_stats:
    asip:
      sic: {min: 0.0, max: 100.0, type: minmax}
      standard_deviation_sic: {mean: 1.952899634621331, std: 4.922985470259985, type: zscore}
      status_flag: {min: 0.0, max: 1536.0, type: minmax}
    cimr:
      SIC: {min: -0.049950417409564574, max: 1.0498479215517267, type: minmax}
      SIT: {mean: 0.09544839558401243, std: 0.13231399596810897, type: zscore}
      Tsurf: {mean: -7.098038910302271, std: 9.410905679026854, type: zscore}
      SICnoise: {mean: 9.402084735405344e-07, std: 0.007446822627062462, type: zscore}
      SITnoise: {mean: -1.244936869388826e-05, std: 0.003507472996277258, type: zscore}
      Tsurfnoise: {mean: -1.6181464698155027e-05, std: 0.0901130348999105, type: zscore}
    cristal:
      HS: {mean: 0.15701109538657623, std: 0.14167074971036836, type: zscore}
      SIT: {mean: 1.713899766845625, std: 1.0358012026065266, type: zscore}
      SSH: {mean: 0.36872446726198005, std: 0.3961191636146796, type: zscore}
      HSnoise: {mean: 0.237219498422366, std: 0.11141783328896704, type: zscore}
      SITnoise: {mean: 1.7138151410883338, std: 1.0360327276131651, type: zscore}
      SSHnoise: {mean: 0.36873967481665904, std: 0.3961927398202259, type: zscore}
  
  # Normalization statistics for covariates
  norm_stats_covs:
    msl: {mean: 101397.28559169156, std: 1178.6647666762826, type: zscore}
    t2m: {mean: 271.533815513639, std: 14.303287836457294, type: zscore}
    u10: {mean: 0.5536510314408732, std: 4.341491519336185, type: zscore}
    v10: {mean: 0.031581173569483305, std: 4.287231013697467, type: zscore}
    tcc: {min: 0.0, max: 1.0, type: minmax}
    d2m: {mean: 268.22918333426907, std: 13.96055261063253, type: zscore}
    ssrd: {mean: -701143.5402508647, std: 785444.8336077137, type: zscore}
    strd: {mean: -1943008.2121575351, std: 466464.69271380285, type: zscore}
    tp: {mean: -0.0001834410365694742, std: 0.0005019462438424605, type: zscore}

model:
  _target_: contrib.CROSCIM.models.Lit4dVarNet_CROSCIM
  persist_rw: False
  multires: [50, 10, 2]
  opt_fn: null
  satellite_vars: ${var_config.satellite_vars}
  covariates: ${var_config.covariates}
  tgt_vars: ${var_config.target_vars}
  var_mapping: ${var_config.var_mapping}
  domain_limits:
    xc:
      _target_: builtins.slice
      _args_: [-3849750., 3749750.]
    yc:
      _target_: builtins.slice
      _args_: [2473750., -4896250.]
  rec_weight: ${optim_weight}
  optim_weight: ${optim_weight}
  prior_weight: ${optim_weight}
  frcst_lead: 0
  solver:
    _target_: contrib.CROSCIM.solver.GradSolvers
    solvers:
      solver_x50:
        _target_: contrib.CROSCIM.solver.GradSolver
        n_step: 1
        lr_grad: 0.2
        input_grad_update: 'obs' #'obs+state' ##'grad-only' #'grad+state' #'obs-only'  # 'grad+previous'  #'gobs+sgprior' #'grad+state'  #'grad-only' #'grad+state'  #'grad+state' #    
        input_vars: ${computed.input_vars_all}
        target_vars: ${var_config.target_vars}
        var_mapping: ${var_config.var_mapping}
        n_time: ${var_config.time_steps.patch_x50}
        obs_cost:
          _target_: contrib.CROSCIM.solver.BaseObsCost
          w: 1.0
          use_target: true
        prior_cost:
          _target_: contrib.CROSCIM.solver.BilinAEPriorCost
          dim_in: ${python_eval:"len(${computed.input_vars_all}) * ${var_config.time_steps.patch_x50}"}
          dim_hidden: 180
          dim_out: ${python_eval:"len(${var_config.target_vars}) * ${var_config.time_steps.patch_x50}"}
        grad_mod:
          _target_: contrib.CROSCIM.solver.GradModelWithCondition
          use_grad_norm: true
          grad_model:
            _target_: contrib.CROSCIM.unet.UNetModel2
            in_channels: ${python_eval:"(len(${computed.input_vars_all})) * ${var_config.time_steps.patch_x50}"}
            out_channels: ${python_eval:"len(${var_config.target_vars}) * ${var_config.time_steps.patch_x50}"}
            model_channels: 64
            num_res_blocks: 1
            channel_mult:
            - 1
            - 2
            attention_resolutions: []
            use_checkpoint: true
            dropout: 0.1
            bias: false
            interp_mode: bilinear
      solver_x10:
        _target_: contrib.CROSCIM.solver.GradSolver
        n_step: 1
        lr_grad: 0.2
        input_grad_update: 'obs' #'obs+state' ##'grad-only' #'grad+state' #'obs-only'  # 'grad+previous'  #'gobs+sgprior' #'grad+state'  #'grad-only' #'grad+state'  #'grad+state' #    
        input_vars: ${computed.input_vars_all}
        target_vars: ${var_config.target_vars}
        var_mapping: ${var_config.var_mapping}
        n_time: ${var_config.time_steps.patch_x10}
        obs_cost:
          _target_: contrib.CROSCIM.solver.BaseObsCost
          w: 1.0
          use_target: true
        prior_cost:
          _target_: contrib.CROSCIM.solver.BilinAEPriorCost
          dim_in: ${python_eval:"len(${computed.input_vars_all}) * ${var_config.time_steps.patch_x10}"}
          dim_hidden: 180
          dim_out: ${python_eval:"len(${var_config.target_vars}) * ${var_config.time_steps.patch_x10}"}
        grad_mod:
          _target_: contrib.CROSCIM.solver.GradModelWithCondition
          use_grad_norm: true
          grad_model:
            _target_: contrib.CROSCIM.unet.UNetModel2
            in_channels: ${python_eval:"(len(${computed.input_vars_all})) * ${var_config.time_steps.patch_x10}"}
            out_channels: ${python_eval:"len(${var_config.target_vars}) * ${var_config.time_steps.patch_x10}"}
            model_channels: 64
            num_res_blocks: 1
            channel_mult:
            - 1
            - 2
            attention_resolutions: []
            use_checkpoint: true
            dropout: 0.1
            bias: false
            interp_mode: bilinear
      solver_x2:
        _target_: contrib.CROSCIM.solver.GradSolver
        n_step: 1
        lr_grad: 0.2
        input_grad_update: 'obs' #'obs+state' ##'grad-only' #'grad+state' #'obs-only'  # 'grad+previous'  #'gobs+sgprior' #'grad+state'  #'grad-only' #'grad+state'  #'grad+state' #    
        input_vars: ${computed.input_vars_all}
        target_vars: ${var_config.target_vars}
        var_mapping: ${var_config.var_mapping}
        n_time: ${var_config.time_steps.patch_x2}
        obs_cost:
          _target_: contrib.CROSCIM.solver.BaseObsCost
          w: 1.0
          use_target: true
        prior_cost:
          _target_: contrib.CROSCIM.solver.BilinAEPriorCost
          dim_in: ${python_eval:"len(${computed.input_vars_all}) * ${var_config.time_steps.patch_x2}"}
          dim_hidden: 180
          dim_out: ${python_eval:"len(${var_config.target_vars}) * ${var_config.time_steps.patch_x2}"}
        grad_mod:
          _target_: contrib.CROSCIM.solver.GradModelWithCondition
          use_grad_norm: true
          grad_model:
            _target_: contrib.CROSCIM.unet.UNetModel2
            in_channels: ${python_eval:"(len(${computed.input_vars_all})) * ${var_config.time_steps.patch_x2}"}
            out_channels: ${python_eval:"len(${var_config.target_vars}) * ${var_config.time_steps.patch_x2}"}
            model_channels: 64
            num_res_blocks: 1
            channel_mult:
            - 1
            - 2
            attention_resolutions: []
            use_checkpoint: true
            dropout: 0.1
            bias: false
            interp_mode: bilinear
  norm_stats: ${datamodule.norm_stats}
  norm_stats_covs: ${datamodule.norm_stats_covs}
  training_strategy: 'progressive'  


optim_weight:
  patch_x50:
    _target_: src.utils.get_uniform_time_wei
    patch_dims: {time: 15, yc: 256, xc: 256}
    crop: {time: 0, yc: 28, xc: 28}
    offset: 0
    dim_order: ["time", "yc", "xc"]
  patch_x10:
    _target_: src.utils.get_uniform_time_wei
    patch_dims: {time: 10, yc: 256, xc: 256}
    crop: {time: 0, yc: 28, xc: 28}
    offset: 0
    dim_order: ["time", "yc", "xc"]
  patch_x2:
    _target_: src.utils.get_uniform_time_wei
    patch_dims: {time: 5, yc: 256, xc: 256}
    crop: {time: 0, yc: 28, xc: 28}
    offset: 0
    dim_order: ["time", "yc", "xc"]

metrics:
  nrmse_scores:
    _target_: src.utils.rmse_based_scores_from_ds
    _partial_: True

entrypoints:
  - _target_: src.train.base_training
    trainer: ${trainer}
    lit_mod: ${model}
    dm: ${datamodule}
    test: True
    save_dir: ${paths.src}/results

