# @package _global_
#
# Flow Matching solver for CROSCIM -- test configuration, Swin U-Net backbone
# variant (FMSwinSolver, flowmatching_swin_solver.py). Mirrors
# FM_solvers/base_arctic_croscim_test_sit_supervised_wbounds.yaml; only the
# solver block (architecture) differs.
# Uses raw data paths (not preproc). Single GPU, short run.

paths:
  src: /Odyssey/private/m19beauc
  mask: /Odyssey/private/m19beauc/4dvarnet-starter/contrib/CROSCIM/mask_PanArctic.nc
  asip: /Odyssey/public/CROSCIM_dataset/ASIP_L3
  cimr: /Odyssey/public/CROSCIM_dataset/data_noise
  cristal: /Odyssey/public/CROSCIM_dataset/out_CRISTAL
  covariates: /Odyssey/public/CROSCIM_dataset/atm_data
  models: /Odyssey/public/CROSCIM_dataset/out_MOD

domain: ???

# ===== CENTRALIZED VARIABLE CONFIGURATION =====
var_config:
  satellite_vars:
    cristal: ["SIT"]
    cimr: ["SIT","SIC"]
    asip: ["sic"]

  models_vars: ["SIT"]

  covariates: ["t2m", "msl", "u10", "v10"]

  target_vars:
    patch_x50:
      - models_SIT
    patch_x10:
      - models_SIT

  var_mapping:
    patch_x50:
      models_SIT: cristal_SIT
    patch_x10:
      models_SIT: cristal_SIT

  time_steps:
    patch_x50: 15
    patch_x10: 8

# ===== COMPUTED VARIABLES =====
computed:
  input_vars_satellite: ${python_eval:"[f'{source}_{var}' for source, vars in ${var_config.satellite_vars}.items() for var in vars]"}
  input_vars_all: ${python_eval:"${computed.input_vars_satellite} + ${var_config.covariates}"}

# ===== FLOW MATCHING CONFIGURATION =====
fm_config:
  lr: 1e-4
  betas: [0.9, 0.995]
  lr_scheduler_start_factor: 1e-5
  lr_scheduler_iters: 10000
  ema_decay: 0.999
  lower_bound: -0.693
  upper_bound: null

# ===== SWIN U-NET ARCHITECTURE (shared by both resolutions; grid_size set per solver) =====
swin_config:
  base_dim: 128
  encoder_depths: [2, 2, 18, 2]
  decoder_depths: [6, 2, 2]
  num_heads: [2, 4, 8, 16]
  window_size: 8
  mlp_ratio: 2.0
  time_dim: 512
  modulation_rank: 128
  drop_path_rate: 0.1
  activation_checkpointing: True

trainer:
  _target_: pytorch_lightning.Trainer
  inference_mode: False
  gradient_clip_val: 0.5
  accelerator: gpu
  devices: [0]
  accumulate_grad_batches: 1
  limit_train_batches: 1000.
  limit_val_batches: 500.
  max_epochs: 500
  precision: bf16-mixed
  logger:
    _target_: pytorch_lightning.loggers.CSVLogger
    save_dir: ${hydra:runtime.output_dir}
    name: ${hydra:runtime.choices.xp}
    version: ''
  callbacks:
    - _target_: pytorch_lightning.callbacks.LearningRateMonitor
      logging_interval: step
    - _target_: pytorch_lightning.callbacks.ModelCheckpoint
      monitor: val_loss
      save_top_k: 3
      save_last: true
      filename: 'FM-Swin-{val_loss:.5f}-{epoch:03d}'

datamodule:
  _target_: contrib.CROSCIM.dataloaders.data_multires_supervised.BaseDataModuleMultiRes

  satellite_vars: ${var_config.satellite_vars}
  covariates: ${var_config.covariates}
  models_vars: ${var_config.models_vars}
  target_vars: ${var_config.target_vars}
  var_mapping: ${var_config.var_mapping}

  asip_paths:
    _target_: contrib.CROSCIM.dataloaders.load_data.get_paths_for_source
    source: asip
    paths: ${paths}
  cimr_paths:
    _target_: contrib.CROSCIM.dataloaders.load_data.get_paths_for_source
    source: cimr
    paths: ${paths}
  cristal_paths:
    _target_: contrib.CROSCIM.dataloaders.load_data.get_paths_for_source
    source: cristal
    paths: ${paths}
  covariates_paths:
    _target_: contrib.CROSCIM.dataloaders.load_data.get_paths_for_source
    source: covariates
    paths: ${paths}
  models_paths:
    _target_: contrib.CROSCIM.dataloaders.load_data.get_paths_for_source
    source: models
    paths: ${paths}

  mask_path: ${paths.mask}
  domain_name: arctic_croscim
  domains:
    train:
      time: {_target_: builtins.slice, _args_: ['2022-05-01', '2022-12-31']}
    val:
      time:
        - {_target_: builtins.slice, _args_: ['2022-05-01', '2022-06-30']}
        - {_target_: builtins.slice, _args_: ['2022-07-01', '2022-12-31']}
    test:
      time: {_target_: builtins.slice, _args_: ['2022-02-01', '2022-02-15']}
  xrds_kw:
    patch_dims: {time: 15, yc: 256, xc: 256}
    strides: {time: 1, yc: 28, xc: 28}
    strides_test: {time: 1, yc: 200, xc: 200}
    patch_dims_dict:
      50: {time: 15, yc: 294, xc: 304}
      10: {time: 15, yc: 256, xc: 256}
    strides_test_dict:
      50: {time: 1, yc: 294, xc: 304}
      10: {time: 1, yc: 200, xc: 200}
    domain_limits: {xc: {_target_: builtins.slice, _args_: [-3849750., 3749750.]},
                    yc: {_target_: builtins.slice, _args_: [2473750., -4896250.]}}
    dl_kw: {batch_size: 2, num_workers: 5, persistent_workers: True}
  res: 500
  pads: [False, False, True]
  norm_stats:
    asip:
      sic: {min: 0.0, max: 100.0, type: minmax}
      standard_deviation_sic: {mean: 1.8761531586097209, std: 4.922335431544444, type: zscore}
      status_flag: {min: 0.0, max: 1536.0, type: minmax}
    cimr:
      SIC: {min: 0.0, max: 1.0, type: minmax}
      SIT: {mean: 0.5695980677516013, std: 0.8216149733058172, type: zscore}
      Tsurf: {mean: -6.3703807274976665, std: 9.394544766238061, type: zscore}
    cristal:
      HS: {mean: 0.15517908473300512, std: 0.13962813089282153, type: zscore}
      SIT: {mean: 0.5695980677516013, std: 0.8216149733058172, type: zscore}
      SSH: {mean: 0.1912636630889516, std: 0.41697635927509086, type: zscore}
  norm_stats_models:
    SIC: {min: 0.0, max: 1.0, type: minmax}
    SIT: {mean: 0.5695980677516013, std: 0.8216149733058172, type: zscore}
    HS: {mean: 0.06844576249551623, std: 0.1137041260225963, type: zscore}
    SSH: {mean: 0.21988234269231605, std: 0.2757902493660287, type: zscore}
  norm_stats_covs:
    msl: {mean: 101261.65922657882, std: 1112.7187312302365, type: zscore}
    t2m: {mean: -2.5985455071070955, std: 13.613745769755358, type: zscore}
    u10: {mean: 0.6010106010949151, std: 4.545559141871505, type: zscore}
    v10: {mean: -0.2104646166032582, std: 4.707062023219409, type: zscore}
    tcc: {min: 1.0896958883677144e-05, max: 0.024753304198384285, type: minmax}
    d2m: {mean: 2.4095910147380064e-08, std: 4.900962447374831e-08, type: zscore}
    ssrd: {mean: 95.72918023746189, std: 93.44316534428312, type: zscore}
    strd: {mean: 265.25246499467744, std: 63.12553499850183, type: zscore}
    tp: {mean: 2.4095910147380064e-08, std: 4.900962447374831e-08, type: zscore}
  multires: [50, 10]

model:
  _target_: contrib.CROSCIM.models.models_flowmatching.Lit4dVarNet_CROSCIM_FlowMatching
  persist_rw: False
  multires: [50,10]
  normalize_anomaly: false
  opt_fn: null

  tgt_vars: ${var_config.target_vars}
  satellite_vars: ${var_config.satellite_vars}
  covariates: ${var_config.covariates}
  models_vars: ${var_config.models_vars}
  var_mapping: ${var_config.var_mapping}

  domain_limits: {xc: {_target_: builtins.slice, _args_: [-3849750., 3749750.]},
                  yc: {_target_: builtins.slice, _args_: [2473750., -4896250.]}}
  rec_weight: ${optim_weight}
  optim_weight: ${optim_weight}
  prior_weight: ${optim_weight}
  frcst_lead: 0
  add_bounds: True
  n_test_members: ${n_test_members}

  fm_config: ${fm_config}

  solver:
    _target_: contrib.CROSCIM.solvers.flowmatching_solver.FMGradSolvers
    solvers:
      solver_x50:
        _target_: contrib.CROSCIM.solvers.flowmatching_swin_solver.FMSwinSolver
        n_input_channels: ${python_eval:"len(${computed.input_vars_all}) * ${var_config.time_steps.patch_x50}"}
        n_output_channels: ${python_eval:"len(${var_config.target_vars.patch_x50}) * ${var_config.time_steps.patch_x50}"}
        grid_size: [294, 304]  # data_multires_supervised: on-the-fly windowed patches, patch_dims_dict[50]
        resolution_km: 50.
        base_dim: ${swin_config.base_dim}
        encoder_depths: ${swin_config.encoder_depths}
        decoder_depths: ${swin_config.decoder_depths}
        num_heads: ${swin_config.num_heads}
        window_size: ${swin_config.window_size}
        mlp_ratio: ${swin_config.mlp_ratio}
        time_dim: ${swin_config.time_dim}
        modulation_rank: ${swin_config.modulation_rank}
        drop_path_rate: ${swin_config.drop_path_rate}
        activation_checkpointing: ${swin_config.activation_checkpointing}
        n_steps: 20
        second_order: True
        add_bounds: True
      solver_x10:
        _target_: contrib.CROSCIM.solvers.flowmatching_swin_solver.FMSwinSolver
        n_input_channels: ${python_eval:"len(${computed.input_vars_all}) * ${var_config.time_steps.patch_x10}"}
        n_output_channels: ${python_eval:"len(${var_config.target_vars.patch_x10}) * ${var_config.time_steps.patch_x10}"}
        grid_size: [256, 256]  # patch_dims_dict[10]
        resolution_km: 10.
        base_dim: ${swin_config.base_dim}
        encoder_depths: ${swin_config.encoder_depths}
        decoder_depths: ${swin_config.decoder_depths}
        num_heads: ${swin_config.num_heads}
        window_size: ${swin_config.window_size}
        mlp_ratio: ${swin_config.mlp_ratio}
        time_dim: ${swin_config.time_dim}
        modulation_rank: ${swin_config.modulation_rank}
        drop_path_rate: ${swin_config.drop_path_rate}
        activation_checkpointing: ${swin_config.activation_checkpointing}
        n_steps: 20
        second_order: True
        add_bounds: True

  norm_stats: ${datamodule.norm_stats}
  norm_stats_covs: ${datamodule.norm_stats_covs}
  norm_stats_models: ${datamodule.norm_stats_models}

optim_weight:
  patch_x10:
    _target_: src.utils.get_linear_time_wei
    patch_dims: {time: 8, yc: 256, xc: 256}
    crop: {time: 0, yc: 28, xc: 28}
    offset: 1
    dim_order: ["time", "yc", "xc"]
  patch_x50:
    _target_: src.utils.get_uniform_time_wei
    patch_dims: {time: 15, yc: 294, xc: 304}
    crop: {time: 0, yc: 0, xc: 0}
    offset: 1
    dim_order: ["time", "yc", "xc"]

metrics:
  nrmse_scores: {_target_: src.utils.rmse_based_scores_from_ds, _partial_: True}
  psd_scores: {_target_: src.utils.psd_based_scores_from_ds, _partial_: True}
  get0: {_target_: operator.itemgetter, _args_: [0]}
  get1: {_target_: operator.itemgetter, _args_: [1]}
  test_metrics:
    mu: {_target_: src.utils.pipe, _partial_: true, fns: ['${metrics.nrmse_scores}', '${metrics.get0}']}
    sig: {_target_: src.utils.pipe, _partial_: true, fns: ['${metrics.nrmse_scores}', '${metrics.get1}']}
    lx: {_target_: src.utils.pipe, _partial_: true, fns: ['${metrics.psd_scores}', '${metrics.get0}']}
    lt: {_target_: src.utils.pipe, _partial_: true, fns: ['${metrics.psd_scores}', '${metrics.get1}']}

# FM is a stochastic solver: sample_one() draws fresh noise per call. With
# n_test_members > 1, test_step (via StochasticEnsembleTestMixin) generates
# that many members per batch inside this single test pass -- dataloader and
# checkpoint are loaded once, not once per member -- and writes one NetCDF
# per member (test_data_..._member{m}.nc).
n_test_members: 5

entrypoints:
  - _target_: src.test.base_test
    trainer: ${trainer}
    lit_mod: ${model}
    dm: ${datamodule}
    ckpt_path: ${paths.src}/4dvarnet-starter/ckpt/CROSCIM/base_croscim_FM_Swin_sit_supervised_wbounds.ckpt
    save_dir: ${paths.src}/results

defaults:
  - /domain: arctic_croscim
