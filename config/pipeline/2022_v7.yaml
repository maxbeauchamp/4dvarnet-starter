# 2022 pipeline v7 (formulation section 9, drift in N0): v6 plus the
# observation window moved to day t along a learned free drift
# (model.advect_window: alpha, theta learned; ERA5 u10 / v10 along the grid
# axes, scripts/drift_feasibility.py). To compare with v6 (same data, same
# epochs): holdout scores, IIEE, fidelity to the inputs. Also the SIT texture
# constraint at M (model.lambda_cyc_sit): sit_std of the generated SIT = sit_std of S_C.
# Starts from v6: G_C (phase 3 of v6) fine-tuned with the moved window; G_M /
# G_H from phase 4 of v6. Run it once v6 has finished its phase 4.
#   sbatch scripts/submit_odyssey.sbatch scripts/run_pipeline.py --config config/pipeline/2022_v7.yaml

out: /Odyssey/private/m19beauc/results/pipeline_2022_v7

dates:
  train: [2022-01-15, 2022-10-31]
  val: [2022-11-01, 2022-11-30]
  test: [2022-12-01, 2022-12-24]

common: ["model.lr_scheduler_iters=2000", "model.n_score_batches=5"]

phases:
  - name: phase3_C
    xp: N0
    init_from: {report: /Odyssey/private/m19beauc/results/pipeline_2022_v6/report.json, phase: phase3_C}
    overrides: ["model.levels=[C]", "model.pyramid=false", "model.advect_window=true"]
    trainer: {max_epochs: 20, limit_train_batches: 1000, limit_val_batches: 50}
  - name: phase4_MH
    xp: N0
    init: phase3_C
    init_overlay:
      report: /Odyssey/private/m19beauc/results/pipeline_2022_v6/report.json
      phase: phase4_MH
      modules: [gen.M, gen.H, down_m, down_h, e_pts_m, e_asip_m, e_asip_h, fuse_m, psi]
    overrides: ["model.levels=[M,H]", "model.pyramid=false", "datamodule.asip_weighted_tiles=true", "model.advect_window=true", "model.lambda_cyc_sit=0.1"]
    trainer: {max_epochs: 20, limit_train_batches: 1000, limit_val_batches: 50}
  - name: phase5_full
    xp: N0
    init: phase4_MH
    overrides: ["model.levels=[C,M,H]", "model.pyramid=true", "datamodule.asip_weighted_tiles=true", "model.advect_window=true", "model.lambda_cyc_sit=0.1"]
    trainer: {max_epochs: 30, limit_train_batches: 1000, limit_val_batches: 50}
  - name: phase6_N1
    xp: N1
    n0: phase5_full
    overrides: ["model.k_max=7", "model.curriculum_epochs=3"]
    trainer: {max_epochs: 25, limit_train_batches: 400, limit_val_batches: 20}

evaluation:
  plot_panels: {ckpt_of: phase5_full, n: 4, members: 8, holdout_asip: true}
  plot_forecast: {ckpt_of: phase6_N1, lead: 7, n: 4, members: 8}
  scenarios: {ckpt_of: phase6_N1, lead: 7, n: 3, members: 8}
