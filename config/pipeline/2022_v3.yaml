# 2022 pipeline v3, retrained from phase 3 (formulation section 8):
# raw CIMR of the last 3 days in the G_C conditioning (model.raw_days),
# smooth Pi^down and HS conditioning (model.smooth_cond), new sigma_0 floors
# and S_C normalisation, tiles drawn by ASIP coverage for G_M / G_H, more epochs.
#   sbatch scripts/submit_odyssey.sbatch scripts/run_pipeline.py --config config/pipeline/2022_v3.yaml

out: /Odyssey/private/m19beauc/results/pipeline_2022_v3

dates:
  train: [2022-01-15, 2022-10-31]
  val: [2022-11-01, 2022-11-30]
  test: [2022-12-01, 2022-12-24]

common: ["model.lr_scheduler_iters=2000", "model.n_score_batches=5"]

phases:
  - name: phase3_C
    xp: N0
    overrides: ["model.levels=[C]", "model.pyramid=false"]
    trainer: {max_epochs: 60, limit_train_batches: 1000, limit_val_batches: 50}
  - name: phase4_MH
    xp: N0
    init: phase3_C
    overrides: ["model.levels=[M,H]", "model.pyramid=false", "datamodule.asip_weighted_tiles=true"]
    trainer: {max_epochs: 40, limit_train_batches: 1000, limit_val_batches: 50}
  - name: phase5_full
    xp: N0
    init: phase4_MH
    overrides: ["model.levels=[C,M,H]", "model.pyramid=true", "datamodule.asip_weighted_tiles=true"]
    trainer: {max_epochs: 30, limit_train_batches: 1000, limit_val_batches: 50}
  - name: phase6_N1
    xp: N1
    n0: phase5_full
    overrides: ["model.k_max=7", "model.curriculum_epochs=3"]
    trainer: {max_epochs: 25, limit_train_batches: 400, limit_val_batches: 20}

evaluation:
  plot_panels: {ckpt_of: phase5_full, n: 4, members: 8, holdout_asip: true}
  plot_forecast: {ckpt_of: phase6_N1, lead: 7, n: 4, members: 8}
  scenarios: {ckpt_of: phase6_N1, lead: 7, n: 3, members: 8}
