# Whole pipeline on the 2022 data (CIMR missing in September: those days are
# not analysis days, and count as unobserved inside the windows).
#   sbatch scripts/submit_odyssey.sbatch scripts/run_pipeline.py --config config/pipeline/2022.yaml
# Resumable: submit the same command again after the job time limit.
# Estimated (H100, measured 0.31 s / step for G_C alone): ~35-40 h in total.

out: /Odyssey/private/m19beauc/results/pipeline_2022

dates:
  train: [2022-01-15, 2022-10-31]   # from Jan 15: full 15-day windows
  val: [2022-11-01, 2022-11-30]
  test: [2022-12-01, 2022-12-24]    # t + 7 still in 2022 (N1 rollouts)

# Hydra overrides common to every phase
common:
  - model.lr_scheduler_iters=2000   # warm-up (20000 by default: half of phase 3)
  - model.n_score_batches=5         # ensemble scores in validation are costly

phases:
  - name: phase3_C                  # G_C alone, no pyramid
    xp: N0
    overrides: ["model.levels=[C]", "model.pyramid=false"]
    trainer: {max_epochs: 40, limit_train_batches: 1000, limit_val_batches: 50}
  - name: phase4_MH                 # G_M + G_H on top of phase 3
    xp: N0
    init: phase3_C
    overrides: ["model.levels=[M,H]", "model.pyramid=false"]
    trainer: {max_epochs: 20, limit_train_batches: 1000, limit_val_batches: 50}
  - name: phase5_full               # whole cascade with the upward pyramid
    xp: N0
    init: phase4_MH
    overrides: ["model.levels=[C,M,H]", "model.pyramid=true"]
    trainer: {max_epochs: 20, limit_train_batches: 1000, limit_val_batches: 50}
  - name: phase6_N1                 # transition, curriculum 1 .. 7 days
    xp: N1
    n0: phase5_full
    overrides: ["model.k_max=7", "model.curriculum_epochs=3"]
    trainer: {max_epochs: 25, limit_train_batches: 400, limit_val_batches: 20}

# evaluation scripts, on the test period (options of each script)
evaluation:
  plot_panels: {ckpt_of: phase5_full, n: 4, members: 8, holdout_asip: true}
  plot_forecast: {ckpt_of: phase6_N1, lead: 7, n: 4, members: 8}
  scenarios: {ckpt_of: phase6_N1, lead: 7, n: 3, members: 8}
