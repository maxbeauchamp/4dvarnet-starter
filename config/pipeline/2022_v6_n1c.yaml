# N1c on the N0 of v6 (phase 5): N1b (increment, state_input, raw_obs) plus a
# background term (model.bg_sigma: where a channel has no target at t+k, its
# previous state is the target, floor 0.5 in normalised units) and cleaner
# training states (analysis_steps 20, push_steps 8). In the N1b rollouts, S_C
# was resampled at random each step and accumulated as a random walk.
#   sbatch scripts/submit_odyssey.sbatch scripts/run_pipeline.py --config config/pipeline/2022_v6_n1c.yaml

out: /Odyssey/private/m19beauc/results/pipeline_2022_v6_n1c

dates:
  train: [2022-01-15, 2022-10-31]
  val: [2022-11-01, 2022-11-30]
  test: [2022-12-01, 2022-12-24]

common: ["model.lr_scheduler_iters=2000", "model.n_score_batches=5"]

phases:
  - name: phase6_N1
    xp: N1
    n0_from: {report: /Odyssey/private/m19beauc/results/pipeline_2022_v6/report.json, phase: phase5_full}
    overrides: ["model.k_max=7", "model.curriculum_epochs=3", "model.increment=true", "model.state_input=true",
                "model.raw_obs=true", "model.bg_sigma=0.5", "model.analysis_steps=20", "model.push_steps=8"]
    trainer: {max_epochs: 25, limit_train_batches: 400, limit_val_batches: 20}

evaluation:
  plot_forecast: {ckpt_of: phase6_N1, lead: 7, n: 4, members: 8}
  scenarios: {ckpt_of: phase6_N1, lead: 7, n: 3, members: 8}
