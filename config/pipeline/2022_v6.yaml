# 2022 pipeline v6 (formulation section 8): v5 plus
#   - lambda_in = 0.3: the day-t ASIP of Y^in as fine targets of G_M / G_H
#     (in v5 they ignored the ASIP they were given);
#   - SIT: CIMR thin-ice SIT (<= 1 m) as a weak target at C outside CRISTAL;
#     SIT and snow are cell means: zero targets where the SIC target is open
#     water (C and, for SIT, M); in v5 G_C SIT was 2-3x worse than CIMR and
#     G_M put ~7 cm of ice in open water;
#   - the fixed phase 4 (G_C side of the encoder frozen).
# G_C: phase 3 of v5 fine-tuned with the new targets; G_M / G_H (and the M side
# of the encoder, psi head): phase 4 of v5, fine-tuned.
#   sbatch scripts/submit_odyssey.sbatch scripts/run_pipeline.py --config config/pipeline/2022_v6.yaml

out: /Odyssey/private/m19beauc/results/pipeline_2022_v6

dates:
  train: [2022-01-15, 2022-10-31]
  val: [2022-11-01, 2022-11-30]
  test: [2022-12-01, 2022-12-24]

common: ["model.lr_scheduler_iters=2000", "model.n_score_batches=5"]

phases:
  - name: phase3_C
    xp: N0
    init_from: {report: /Odyssey/private/m19beauc/results/pipeline_2022_v5/report.json, phase: phase3_C}
    overrides: ["model.levels=[C]", "model.pyramid=false"]
    trainer: {max_epochs: 20, limit_train_batches: 1000, limit_val_batches: 50}
  - name: phase4_MH
    xp: N0
    init: phase3_C
    init_overlay:
      report: /Odyssey/private/m19beauc/results/pipeline_2022_v5/report.json
      phase: phase4_MH
      modules: [gen.M, gen.H, down_m, down_h, e_pts_m, e_asip_m, e_asip_h, fuse_m, psi]
    overrides: ["model.levels=[M,H]", "model.pyramid=false", "datamodule.asip_weighted_tiles=true"]
    trainer: {max_epochs: 20, limit_train_batches: 1000, limit_val_batches: 50}
  - name: phase5_full
    xp: N0
    init: phase4_MH
    overrides: ["model.levels=[C,M,H]", "model.pyramid=true", "datamodule.asip_weighted_tiles=true"]
    trainer: {max_epochs: 30, limit_train_batches: 1000, limit_val_batches: 50}
  - name: phase6_N1
    xp: N1
    n0: phase5_full
    overrides: ["model.k_max=7", "model.curriculum_epochs=3"]
    trainer: {max_epochs: 25, limit_train_batches: 400, limit_val_batches: 20}

evaluation:
  plot_panels: {ckpt_of: phase5_full, n: 4, members: 8, holdout_asip: true}
  plot_forecast: {ckpt_of: phase6_N1, lead: 7, n: 4, members: 8}
  scenarios: {ckpt_of: phase6_N1, lead: 7, n: 3, members: 8}
