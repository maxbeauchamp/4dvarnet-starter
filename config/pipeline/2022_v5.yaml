# 2022 pipeline v5 (formulation section 8): v4 plus
#   - G_M / G_H as correctors of the prolonged coarser sample (model.corrector):
#     targets Y - P' X^sample, no R dX = 0, censored at the physical bounds;
#     they can correct X_C and remove the 32 km steps of v4;
#   - CIMR of day t as a weak SIC target at C outside the ASIP coverage
#     (scale floor 0.15): v4 had no SIC target in open water far from the edge.
# G_C starts from the one of v4 (same networks), G_M / G_H from scratch.
#   sbatch scripts/submit_odyssey.sbatch scripts/run_pipeline.py --config config/pipeline/2022_v5.yaml

out: /Odyssey/private/m19beauc/results/pipeline_2022_v5

dates:
  train: [2022-01-15, 2022-10-31]
  val: [2022-11-01, 2022-11-30]
  test: [2022-12-01, 2022-12-24]

common: ["model.lr_scheduler_iters=2000", "model.n_score_batches=5"]

phases:
  - name: phase3_C                  # G_C of v4, fine-tuned with the weak CIMR SIC target
    xp: N0
    init_from: {report: /Odyssey/private/m19beauc/results/pipeline_2022_v4/report.json, phase: phase3_C}
    overrides: ["model.levels=[C]", "model.pyramid=false"]
    trainer: {max_epochs: 25, limit_train_batches: 1000, limit_val_batches: 50}
  - name: phase4_MH
    xp: N0
    init: phase3_C
    overrides: ["model.levels=[M,H]", "model.pyramid=false", "datamodule.asip_weighted_tiles=true"]
    trainer: {max_epochs: 40, limit_train_batches: 1000, limit_val_batches: 50}
  - name: phase5_full
    xp: N0
    init: phase4_MH
    overrides: ["model.levels=[C,M,H]", "model.pyramid=true", "datamodule.asip_weighted_tiles=true"]
    trainer: {max_epochs: 30, limit_train_batches: 1000, limit_val_batches: 50}
  - name: phase6_N1
    xp: N1
    n0: phase5_full
    overrides: ["model.k_max=7", "model.curriculum_epochs=3"]
    trainer: {max_epochs: 25, limit_train_batches: 400, limit_val_batches: 20}

evaluation:
  plot_panels: {ckpt_of: phase5_full, n: 4, members: 8, holdout_asip: true}
  plot_forecast: {ckpt_of: phase6_N1, lead: 7, n: 4, members: 8}
  scenarios: {ckpt_of: phase6_N1, lead: 7, n: 3, members: 8}
