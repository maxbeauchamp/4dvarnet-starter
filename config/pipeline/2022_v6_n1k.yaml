# N1k = N1j with the weak CIMR SIC target back, but only in the steps whose conditioning has
# the observations of the day (model.weak_sic=seen): N1j beat persistence (= drift-only,
# the network adds little) but ignored the observations (w = 1 = w = 0). Expected: w = 0 as
# N1j, w = 1 closer to CIMR.
#
# N1j = N1i without the weak CIMR SIC target in N1 (model.weak_sic; the thin-SIT one stays):
# N1i drifted linearly through CIMR (~-0.015 SIC / day, March as Nov / Dec, half of it at
# w = 1): with the observations dropped the model still had to reach CIMR (~0.03 below the
# state) and learnt a blind negative increment. Off the ASIP passes the background (the
# state moved by the free drift, sigma 0.05) takes over.
#
# N1i = N1h + the SIC increment scale alone at 0.05 (model.inc_scale_sic): the N1h pack lost
# ice in March (training) as in November / December (-0.08 at lead 1 to -0.27; persistence
# ~0): the per-step SIC noise (pixel speckle, spread 0.1-0.2 in the pack), stuck against
# SIC = 1 and carried on by the background, walked the pack down. SIT / HS keep 0.2.
#
# N1h = N1g + Tobit censoring of the targets at a bound (model.tobit): N1g lost pack ice
# and iced open water a little more each day (SIC bias by class of the initial state,
# pack -0.09 at lead 1 to -0.29, open water +0.10 to +0.15, persistence ~0): the former
# rule penalised any overshoot of a target at the bound, an uncertain prediction stayed
# inside and the sampler clamp could not bring it back.
#
# N1g on the N0 of v6 (phase 5): N1f (rollout_stats 2022-12-24, w = 0, vs N1c) with
#   - a tight background (bg_sigma 0.05 instead of 0.15): outside the ASIP passes the
#     increment was nearly free, SIC drifted towards the mean in N1c and N1f alike
#     (RMS 0.71 -> 0.48 / 0.54 at lead 7) and the spread stayed ~0.1 whatever the day;
#   - the free-drift move in bicubic (model.warp_mode): the bilinear move diffused the
#     state (N1f lead 7: sic_std 1.00 -> 0.74, aniso 1.09 -> 0.62; N1c without the move:
#     the increment noise piled up instead, sic_std -> 2.14);
#   - the non-finite step guards (the N1f run turned nan at epoch 21).
#   sbatch scripts/submit_odyssey.sbatch scripts/run_pipeline.py --config config/pipeline/2022_v6_n1k.yaml

out: /Odyssey/private/m19beauc/results/pipeline_2022_v6_n1k

dates:
  train: [2022-01-15, 2022-10-31]
  val: [2022-11-01, 2022-11-30]
  test: [2022-12-01, 2022-12-24]

common: ["model.lr_scheduler_iters=2000", "model.n_score_batches=5"]

phases:
  - name: phase6_N1
    xp: N1
    n0_from: {report: /Odyssey/private/m19beauc/results/pipeline_2022_v6/report.json, phase: phase5_full}
    overrides: ["model.k_max=7", "model.curriculum_epochs=3", "model.increment=true", "model.state_input=true",
                "model.raw_obs=true", "model.bg_sigma=0.05", "model.analysis_steps=20", "model.push_steps=8",
                "model.inc_scale=0.2", "model.bg_advect=true", "model.warp_mode=bicubic", "model.tobit=true",
                "model.inc_scale_sic=0.05", "model.weak_sic=seen"]
    trainer: {max_epochs: 25, limit_train_batches: 400, limit_val_batches: 20}

evaluation:
  plot_forecast: {ckpt_of: phase6_N1, lead: 7, n: 4, members: 8}
  scenarios: {ckpt_of: phase6_N1, lead: 7, n: 3, members: 8}
