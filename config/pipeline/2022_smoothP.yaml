# 2022 pipeline after the smooth prolongation P' (formulation section 1):
# G_C (phase 3) does not depend on P and is taken from the first run; G_M,
# G_H, the pyramid and N1 are retrained.
#   sbatch scripts/submit_odyssey.sbatch scripts/run_pipeline.py --config config/pipeline/2022_smoothP.yaml
# Before: re-measure the detail scales dSIC_M, dSIT_M, dSIC_H (the details
# relative to P' X are smaller than with the injection) with
# scripts/inspect_data.py and update model.norm in config/xp/N0.yaml.

out: /Odyssey/private/m19beauc/results/pipeline_2022_smoothP

dates:
  train: [2022-01-15, 2022-10-31]
  val: [2022-11-01, 2022-11-30]
  test: [2022-12-01, 2022-12-24]

common: ["model.lr_scheduler_iters=2000", "model.n_score_batches=5"]

phases:
  - name: phase4_MH                 # G_M + G_H on top of the first run's G_C
    xp: N0
    init_from: {report: /Odyssey/private/m19beauc/results/pipeline_2022/report.json, phase: phase3_C}
    overrides: ["model.levels=[M,H]", "model.pyramid=false"]
    trainer: {max_epochs: 20, limit_train_batches: 1000, limit_val_batches: 50}
  - name: phase5_full
    xp: N0
    init: phase4_MH
    overrides: ["model.levels=[C,M,H]", "model.pyramid=true"]
    trainer: {max_epochs: 20, limit_train_batches: 1000, limit_val_batches: 50}
  - name: phase6_N1
    xp: N1
    n0: phase5_full
    overrides: ["model.k_max=7", "model.curriculum_epochs=3"]
    trainer: {max_epochs: 25, limit_train_batches: 400, limit_val_batches: 20}

evaluation:
  plot_panels: {ckpt_of: phase5_full, n: 4, members: 8, holdout_asip: true}
  plot_forecast: {ckpt_of: phase6_N1, lead: 7, n: 4, members: 8}
  scenarios: {ckpt_of: phase6_N1, lead: 7, n: 3, members: 8}
