# Registry of the 8 compared methods, per variable (xp).
#
# - `generative: true`  -> the method samples an ensemble (CRPS computable),
#   `n_samples_metrics` = 20 for these 6 methods during the metrics phase
#   (reduced from 50 to keep the cost of full-test-set evaluation reasonable).
# - `generative: false` -> deterministic method (UNet, 4dvarnet_lstm), no CRPS,
#   `n_samples_metrics` = 1.
# - For each xp (GP/SIC/SSH_GF), `notebook` points to the file under
#   Notebooks/Notebooks_<XP>/. `status: existing` = notebook already present in the repo,
#   `status: generated` = notebook to be produced by generate_missing_notebooks.py.
# - `log_dir`: name of the logs/checkpoints directory as produced by the notebook
#   (non-uniform convention from one notebook to another — deliberately made explicit
#   here rather than derived from a formula, cf. CLAUDE.md notes / exploration).
# - `params`: papermill overrides specific to the method (SOLVER_TYPE, COND_MODE).
#
# ⚠️ Entries marked "TO VERIFY": log_dir value not confirmed by direct reading
# of the notebook (to validate during the smoke test, cf. plan "Verification" step).

methods:
  UNet:
    generative: false
    n_samples_metrics: 1
    params: {}
    xp:
      GP:
        notebook: Notebook_direct_unet_spde.ipynb
        log_dir: logs_direct_unet_GP
        status: existing
      SIC:
        notebook: Notebook_direct_unet_sic.ipynb
        log_dir: logs_direct_unet_SIC
        status: generated
      SSH_GF:
        notebook: Notebook_direct_unet.ipynb
        log_dir: logs_direct_unet
        status: existing

  4dvarnet_lstm:
    generative: false
    n_samples_metrics: 1
    params:
      SOLVER_TYPE: lstm
    xp:
      GP:
        notebook: Notebook_4dvarnet_unet_spde.ipynb
        log_dir: logs_4dvarnet_lstm_spde
        status: existing
      SIC:
        notebook: Notebook_4dvarnet_unet_sic.ipynb
        log_dir: logs_4dvarnet_lstm_sic
        status: generated
      SSH_GF:
        notebook: Notebook_4dvarnet_unet.ipynb
        log_dir: logs_4dvarnet_lstm          # TO VERIFY: confirm whether LOG_DIR depends on SOLVER_TYPE here as in GP
        status: existing

  CM:
    generative: true
    n_samples_metrics: 20
    params: {}
    xp:
      GP:
        notebook: Notebook_consistency_model_CM_spde.ipynb
        log_dir: logs_CT_CM_spde
        status: existing
      SIC:
        notebook: Notebook_consistency_model_CM_sic.ipynb
        log_dir: logs_CT_CM_sic
        status: existing
      SSH_GF:
        notebook: Notebook_consistency_model_CM_ssh_gf.ipynb
        log_dir: logs_CT_CM_ssh_gf
        status: existing

  CMT:
    # ICLR rebuttal: pairwise CM with ODE-teacher targets (consistency_models/teacher_targets.py, FM teacher),
    # warm-started from the submitted CM checkpoint. GP only for now.
    generative: true
    n_samples_metrics: 20
    params:
      MAX_EPOCHS: 600
    xp:
      GP:
        notebook: Notebook_consistency_model_CMT_spde.ipynb
        log_dir: logs_CMT_spde
        status: generated
      SSH_GF:
        notebook: Notebook_consistency_model_CMT_ssh_gf.ipynb
        log_dir: logs_CMT_ssh_gf
        status: generated

  VarCM:
    # ICLR rebuttal (GP): CRPS ensemble anchors (pixels + spatial/temporal increments), fixed grid, warm start
    # from the submitted model (now VarCM_v1). SSH/SIC entries are still the submitted models.
    generative: true
    n_samples_metrics: 20
    params:
      MAX_EPOCHS: 300
      COND_MODE: grad
    xp:
      GP:
        notebook: Notebook_consistency_model_VarCM_spde.ipynb
        log_dir: logs_VarCM_crps2_spde_grad
        status: existing
      SIC:
        notebook: Notebook_consistency_model_VarCM_sic.ipynb
        log_dir: logs_CT_VarCM_sic_grad
        status: generated
      SSH_GF:
        notebook: Notebook_consistency_model_VarCM_ssh_gf.ipynb
        log_dir: logs_CT_VarCM_ssh_gf_grad
        status: generated

  VarCM_v1:
    # Submitted version (L2 anchors), kept for the comparison. GP only.
    generative: true
    n_samples_metrics: 20
    params:
      COND_MODE: grad
    xp:
      GP:
        notebook: Notebook_consistency_model_VarCM_v1_spde.ipynb
        log_dir: logs_CT_VarCM_spde_grad
        status: existing

  VarCMT:
    # ICLR rebuttal: VarCM + tangent condition (lambda_tan, consistency_models_VarCM.py), warm-started from VarCM.
    # Deterministic variational solver (VarCM-B). GP only for now.
    generative: true
    n_samples_metrics: 20
    params:
      COND_MODE: grad
      MAX_EPOCHS: 600
    xp:
      GP:
        notebook: Notebook_consistency_model_VarCMT_spde.ipynb
        log_dir: logs_VarCMT_spde_grad
        status: generated

  DynCM:
    generative: true
    n_samples_metrics: 20
    params: {}
    xp:
      GP:
        notebook: Notebook_consistency_model_DynCM_spde.ipynb
        log_dir: logs_CT_DynCM_spde
        status: existing
      SIC:
        notebook: Notebook_consistency_model_DynCM_sic.ipynb
        log_dir: logs_CT_DynCM_sic
        status: generated
      SSH_GF:
        notebook: Notebook_consistency_model_DynCM_ssh_gf.ipynb
        log_dir: logs_CT_DynCM_ssh_gf
        status: generated

  DynCMT:
    # ICLR rebuttal: DynCM with DynFM-teacher targets (consistency_models/teacher_targets.py), no L2 data
    # anchors, warm-started from the submitted DynCM. GP only for now.
    generative: true
    n_samples_metrics: 20
    params:
      MAX_EPOCHS: 600
    xp:
      GP:
        notebook: Notebook_consistency_model_DynCMT_spde.ipynb
        log_dir: logs_DynCMT_spde
        status: generated

  VarDynCM:
    # ICLR rebuttal (GP): CRPS ensemble anchors (pixels + spatial/temporal increments), fixed grid, warm start
    # from the submitted model (now VarDynCM_v1). SSH/SIC entries are still the submitted models.
    generative: true
    n_samples_metrics: 20
    params:
      MAX_EPOCHS: 200
      COND_MODE: grad
    xp:
      GP:
        notebook: Notebook_consistency_model_VarDynCM_spde.ipynb
        log_dir: logs_VarDynCM_crps_spde_grad
        status: existing
      SIC:
        notebook: Notebook_consistency_model_VarDynCM_sic.ipynb
        log_dir: logs_CT_VarDynCM_sic_grad
        status: generated
      SSH_GF:
        notebook: Notebook_consistency_model_VarDynCM_ssh_gf.ipynb
        log_dir: logs_CT_VarDynCM_ssh_gf_grad
        status: generated

  VarCM_ls01:
    # ICLR rebuttal (GP), second CRPS stage: self-consistency weight 0.1 (was 1), 100 epochs from VarCM (crps2,
    # 300 epochs), checkpoint chosen on the validation CRPS of the ensemble. Same notebook as VarCM.
    generative: true
    n_samples_metrics: 20
    params:
      MAX_EPOCHS: 100
      COND_MODE: grad
      LAMBDA_SELF: 0.1
      RUN_TAG: _ls01
      WARM_FROM: logs_VarCM_crps2_spde_grad
      SELECT_BY_VAL: true
    xp:
      GP:
        notebook: Notebook_consistency_model_VarCM_spde.ipynb
        log_dir: logs_VarCM_crps2_spde_grad_ls01
        status: existing

  VarCM_v3:
    # ICLR rebuttal (GP), VarCM v3: no L2 target left (short anchor scored by the CRPS) and the CRPS also applied
    # to the evaluation sampler's own K-step chain (K in {3,5,8,15}); 100 epochs from VarCM (crps2, 300 epochs),
    # checkpoint chosen on the validation CRPS. Same notebook as VarCM.
    generative: true
    n_samples_metrics: 20
    params:
      MAX_EPOCHS: 100
      COND_MODE: grad
      RUN_TAG: _v3
      WARM_FROM: logs_VarCM_crps2_spde_grad
      SELECT_BY_VAL: true
      SHORT_CRPS: true
      ROLLOUT_STEPS: [3, 5, 8, 15]
    xp:
      GP:
        notebook: Notebook_consistency_model_VarCM_spde.ipynb
        log_dir: logs_VarCM_crps2_spde_grad_v3
        status: existing

  VarDynCM_ls01:
    # ICLR rebuttal (GP): self-consistency weight 0.1 (was 1; L_comp fought the CRPS and the 200-epoch run
    # degraded), 100 epochs from the submitted VarDynCM, checkpoint chosen on the validation CRPS. Same notebook.
    generative: true
    n_samples_metrics: 20
    params:
      MAX_EPOCHS: 100
      COND_MODE: grad
      LAMBDA_SELF: 0.1
      RUN_TAG: _ls01
      SELECT_BY_VAL: true
    xp:
      GP:
        notebook: Notebook_consistency_model_VarDynCM_spde.ipynb
        log_dir: logs_VarDynCM_crps_spde_grad_ls01
        status: existing

  VarDynCM_fg:
    # Evaluation variant of VarDynCM (CRPS, 200 epochs): sampled on the frame grid it is trained on
    # (1 -> IC, then one jump per frame, C network calls) instead of 25 uniform steps.
    generative: true
    n_samples_metrics: 20
    params:
      MAX_EPOCHS: 200
      COND_MODE: grad
      FRAME_GRID: true
      EVAL_TAG: _fg
    xp:
      GP:
        notebook: Notebook_consistency_model_VarDynCM_spde.ipynb
        log_dir: logs_VarDynCM_crps_spde_grad
        status: existing

  VarDynCM_ls01_fg:
    # Same for VarDynCM_ls01 (best validation-CRPS checkpoint, which was scored on that frame grid).
    generative: true
    n_samples_metrics: 20
    params:
      MAX_EPOCHS: 100
      COND_MODE: grad
      LAMBDA_SELF: 0.1
      RUN_TAG: _ls01
      SELECT_BY_VAL: true
      FRAME_GRID: true
      EVAL_TAG: _fg
    xp:
      GP:
        notebook: Notebook_consistency_model_VarDynCM_spde.ipynb
        log_dir: logs_VarDynCM_crps_spde_grad_ls01
        status: existing

  VarDynCM_v1:
    # Submitted version (L2 anchors), kept for the comparison. GP only.
    generative: true
    n_samples_metrics: 20
    params:
      COND_MODE: grad
    xp:
      GP:
        notebook: Notebook_consistency_model_VarDynCM_v1_spde.ipynb
        log_dir: logs_CT_VarDynCM_spde_grad
        status: existing

  FM:
    generative: true
    n_samples_metrics: 20
    params: {}
    xp:
      GP:
        notebook: Notebook_flowmatching_model_FM_spde.ipynb
        log_dir: logs_FM_spde
        status: existing
      SIC:
        notebook: Notebook_flowmatching_model_FM_sic.ipynb
        log_dir: logs_FM_sic
        status: existing
      SSH_GF:
        notebook: Notebook_flowmatching_model_FM_ssh_gf.ipynb
        log_dir: logs_FM_ssh_gf
        status: existing

  DynFM:
    generative: true
    n_samples_metrics: 20
    params: {}
    xp:
      GP:
        notebook: Notebook_flowmatching_model_DynFM_spde.ipynb
        log_dir: logs_DynFM_spde
        status: existing
      SIC:
        notebook: Notebook_flowmatching_model_DynFM_sic.ipynb
        log_dir: logs_DynFM_sic
        status: generated
      SSH_GF:
        notebook: Notebook_flowmatching_model_DynFM_ssh_gf.ipynb
        log_dir: logs_DynFM_ssh_gf
        status: generated

xp_notebook_dir:
  GP: Notebooks_GP
  SIC: Notebooks_SIC
  SSH_GF: Notebooks_SSH_GF

# Uniform epoch count requested (replaces the heterogeneous 2500/1000/502
# values previously hardcoded in the GP notebooks).
max_epochs: 2000

# "Template" dataloader used by generate_missing_notebooks.py for each target
# xp (source notebook for the data-loading cell + domain config).
dataloader_template:
  SIC: Notebook_consistency_model_CM_sic.ipynb
  SSH_GF: Notebook_consistency_model_CM_ssh_gf.ipynb

# Target variables with NaN gaps requiring a masked loss (LitFlowMatchingSIC
# .training_step / masked_average pattern, cf. FM_sic).
xp_has_nan_target:
  GP: false
  SIC: true
  SSH_GF: false
