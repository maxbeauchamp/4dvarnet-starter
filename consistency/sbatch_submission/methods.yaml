# Registry of the 8 compared methods, per variable (xp).
#
# - `generative: true`  -> the method samples an ensemble (CRPS computable),
#   `n_samples_metrics` = 20 for these 6 methods during the metrics phase
#   (reduced from 50 to keep the cost of full-test-set evaluation reasonable).
# - `generative: false` -> deterministic method (UNet, 4dvarnet_lstm), no CRPS,
#   `n_samples_metrics` = 1.
# - For each xp (GP/SIC/SSH_GF), `notebook` points to the file under
#   Notebooks/Notebooks_<XP>/. `status: existing` = notebook already present in the repo,
#   `status: generated` = notebook to be produced by generate_missing_notebooks.py.
# - `log_dir`: name of the logs/checkpoints directory as produced by the notebook
#   (non-uniform convention from one notebook to another — deliberately made explicit
#   here rather than derived from a formula, cf. CLAUDE.md notes / exploration).
# - `params`: papermill overrides specific to the method (SOLVER_TYPE, COND_MODE).
#
# ⚠️ Entries marked "TO VERIFY": log_dir value not confirmed by direct reading
# of the notebook (to validate during the smoke test, cf. plan "Verification" step).

methods:
  UNet:
    generative: false
    n_samples_metrics: 1
    params: {}
    xp:
      GP:
        notebook: Notebook_direct_unet_spde.ipynb
        log_dir: logs_direct_unet_GP
        status: existing
      SIC:
        notebook: Notebook_direct_unet_sic.ipynb
        log_dir: logs_direct_unet_SIC
        status: generated
      SSH_GF:
        notebook: Notebook_direct_unet.ipynb
        log_dir: logs_direct_unet
        status: existing

  4dvarnet_lstm:
    generative: false
    n_samples_metrics: 1
    params:
      SOLVER_TYPE: lstm
    xp:
      GP:
        notebook: Notebook_4dvarnet_unet_spde.ipynb
        log_dir: logs_4dvarnet_lstm_spde
        status: existing
      SIC:
        notebook: Notebook_4dvarnet_unet_sic.ipynb
        log_dir: logs_4dvarnet_lstm_sic
        status: generated
      SSH_GF:
        notebook: Notebook_4dvarnet_unet.ipynb
        log_dir: logs_4dvarnet_lstm          # TO VERIFY: confirm whether LOG_DIR depends on SOLVER_TYPE here as in GP
        status: existing

  CM:
    generative: true
    n_samples_metrics: 20
    params: {}
    xp:
      GP:
        notebook: Notebook_consistency_model_CM_spde.ipynb
        log_dir: logs_CT_CM_spde
        status: existing
      SIC:
        notebook: Notebook_consistency_model_CM_sic.ipynb
        log_dir: logs_CT_CM_sic
        status: existing
      SSH_GF:
        notebook: Notebook_consistency_model_CM_ssh_gf.ipynb
        log_dir: logs_CT_CM_ssh_gf
        status: existing

  CMT:
    # ICLR rebuttal: pairwise CM with ODE-teacher targets (consistency_models/teacher_targets.py, FM teacher),
    # warm-started from the submitted CM checkpoint. GP only for now.
    generative: true
    n_samples_metrics: 20
    params:
      MAX_EPOCHS: 600
    xp:
      GP:
        notebook: Notebook_consistency_model_CMT_spde.ipynb
        log_dir: logs_CMT_spde
        status: generated
      SSH_GF:
        notebook: Notebook_consistency_model_CMT_ssh_gf.ipynb
        log_dir: logs_CMT_ssh_gf
        status: generated
      SIC:
        # FM_v2 SIC teacher (validation-selected), from scratch
        notebook: Notebook_consistency_model_CMT_sic.ipynb
        log_dir: logs_CMT_sic
        status: existing
        params:
          MAX_TIME: "00:04:45:00"   # same training time as CMT_v2 on SSH (more SIC data: equal time, not equal epochs)

  VarCM:
    # ICLR rebuttal (GP): CRPS ensemble anchors (pixels + spatial/temporal increments), fixed grid, warm start
    # from the submitted model (now VarCM_v1). SSH/SIC entries are still the submitted models.
    generative: true
    n_samples_metrics: 20
    params:
      MAX_EPOCHS: 300
      COND_MODE: grad
    xp:
      GP:
        notebook: Notebook_consistency_model_VarCM_spde.ipynb
        log_dir: logs_VarCM_crps2_spde_grad
        status: existing
      SIC:
        notebook: Notebook_consistency_model_VarCM_sic.ipynb
        log_dir: logs_CT_VarCM_sic_grad
        status: generated

  VarCM_v1:
    # Submitted version (L2 anchors), kept for the comparison. GP only.
    generative: true
    n_samples_metrics: 20
    params:
      COND_MODE: grad
    xp:
      GP:
        notebook: Notebook_consistency_model_VarCM_v1_spde.ipynb
        log_dir: logs_CT_VarCM_spde_grad
        status: existing
      SSH_GF:
        notebook: Notebook_consistency_model_VarCM_v1_ssh_gf.ipynb
        log_dir: logs_CT_VarCM_ssh_gf_grad
        status: existing


  VarCMT:
    # ICLR rebuttal: VarCM + tangent condition (lambda_tan, consistency_models_VarCM.py), warm-started from VarCM.
    # Deterministic variational solver (VarCM-B). GP only for now.
    generative: true
    n_samples_metrics: 20
    params:
      COND_MODE: grad
      MAX_EPOCHS: 600
    xp:
      GP:
        notebook: Notebook_consistency_model_VarCMT_spde.ipynb
        log_dir: logs_VarCMT_spde_grad
        status: generated

  DynCM:
    generative: true
    n_samples_metrics: 20
    params: {}
    xp:
      GP:
        notebook: Notebook_consistency_model_DynCM_spde.ipynb
        log_dir: logs_CT_DynCM_spde
        status: existing
      SIC:
        notebook: Notebook_consistency_model_DynCM_sic.ipynb
        log_dir: logs_CT_DynCM_sic
        status: generated
      SSH_GF:
        notebook: Notebook_consistency_model_DynCM_ssh_gf.ipynb
        log_dir: logs_CT_DynCM_ssh_gf
        status: generated

  DynCMT:
    # ICLR rebuttal: DynCM with DynFM-teacher targets (consistency_models/teacher_targets.py), no L2 data
    # anchors, warm-started from the submitted DynCM. GP only for now.
    generative: true
    n_samples_metrics: 20
    params:
      MAX_EPOCHS: 600
    xp:
      GP:
        notebook: Notebook_consistency_model_DynCMT_spde.ipynb
        log_dir: logs_DynCMT_spde
        status: generated
      SSH_GF:
        # DynFM_v2 teacher (validation-selected), from scratch
        notebook: Notebook_consistency_model_DynCMT_ssh_gf.ipynb
        log_dir: logs_DynCMT_ssh_gf
        status: existing
      SIC:
        # DynFM_v2 SIC teacher; SIC data adapted by rebuttal/make_sic_chain.py; training time ~ SSH
        notebook: Notebook_consistency_model_DynCMT_sic.ipynb
        log_dir: logs_DynCMT_sic
        status: existing
        params:
          MAX_TIME: "00:05:00:00"

  VarDynCM:
    # ICLR rebuttal (GP): CRPS ensemble anchors (pixels + spatial/temporal increments), fixed grid, warm start
    # from the submitted model (now VarDynCM_v1). SSH/SIC entries are still the submitted models.
    generative: true
    n_samples_metrics: 20
    params:
      MAX_EPOCHS: 200
      COND_MODE: grad
    xp:
      GP:
        notebook: Notebook_consistency_model_VarDynCM_spde.ipynb
        log_dir: logs_VarDynCM_crps_spde_grad
        status: existing
      SIC:
        notebook: Notebook_consistency_model_VarDynCM_sic.ipynb
        log_dir: logs_CT_VarDynCM_sic_grad
        status: generated

  FM_lastv2:
    # SSH teacher check: last.ckpt of logs_FM_ssh_gf has the size of the ~200-epoch checkpoints, while a run to
    # ~1974 epochs exists (last-v2.ckpt). Evaluate FM SSH with last-v2.ckpt (no retraining).
    generative: true
    n_samples_metrics: 20
    params:
      CKPT_FILE: last-v2.ckpt
    xp:
      SSH_GF:
        notebook: Notebook_flowmatching_model_FM_ssh_gf.ipynb
        log_dir: logs_FM_ssh_gf
        status: existing

  FM_v2:
    # SSH teacher, retrained from scratch with the checkpoint chosen on the validation CRPS of the ensemble
    # (patch_ssh_teachers.py). The submitted FM (~200 / ~1970 epochs, train-loss checkpoints) is over-confident.
    generative: true
    n_samples_metrics: 20
    params:
      MAX_EPOCHS: 400
      RUN_TAG: _v2
      SELECT_BY_VAL: true
    xp:
      SSH_GF:
        notebook: Notebook_flowmatching_model_FM_ssh_gf.ipynb
        log_dir: logs_FM_ssh_gf_v2
        status: existing
      SIC:
        notebook: Notebook_flowmatching_model_FM_sic.ipynb
        log_dir: logs_FM_sic_v2
        status: existing
        params:
          MAX_TIME: "00:02:45:00"   # same training time as FM_v2 on SSH

  DynFM_v2:
    # Same for the DynFM teacher on SSH.
    generative: true
    n_samples_metrics: 20
    params:
      MAX_EPOCHS: 400
      RUN_TAG: _v2
      SELECT_BY_VAL: true
    xp:
      SSH_GF:
        notebook: Notebook_flowmatching_model_DynFM_ssh_gf.ipynb
        log_dir: logs_DynFM_ssh_gf_v2
        status: existing
      SIC:
        notebook: Notebook_flowmatching_model_DynFM_sic.ipynb
        log_dir: logs_DynFM_sic_v2
        status: existing
        params:
          MAX_TIME: "00:02:15:00"   # DynFM_v2 SSH: ~2h15 of training

  DynFM_v2_more:
    # SIC: DynFM_v2 stopped by its 2h15 budget at epoch ~104/400 with the validation CRPS still decreasing
    # (0.42 -> 0.155); resumed from its last checkpoint (no reset). Lightning restores the elapsed time of the
    # Timer, so MAX_TIME is the new total (~4h15 more).
    generative: true
    n_samples_metrics: 20
    params:
      MAX_EPOCHS: 400
      RUN_TAG: _v2
      SELECT_BY_VAL: true
    xp:
      SIC:
        notebook: Notebook_flowmatching_model_DynFM_sic.ipynb
        log_dir: logs_DynFM_sic_v2
        status: existing
        params:
          MAX_TIME: "00:06:30:00"

  FM_v3:
    # SIC: FM_v2 with the target gaps filled by OSI SAF in the interpolant (GAP_FILL='osi'; loss still masked).
    # FM_v2 filled them with 0, i.e. open water: x_t then carries fake open-water holes never seen at sampling.
    generative: true
    n_samples_metrics: 20
    params:
      MAX_EPOCHS: 400
      RUN_TAG: _v3
      SELECT_BY_VAL: true
      GAP_FILL: osi
    xp:
      SIC:
        notebook: Notebook_flowmatching_model_FM_sic.ipynb
        log_dir: logs_FM_sic_v3
        status: existing
        params:
          MAX_TIME: "00:02:45:00"

  DynFM_v3:
    # SIC: DynFM with OSI-SAF-filled gaps (see FM_v3). In the physical regime x_t is a blend of two target frames,
    # so zero-filled gaps (whole missing frames included) gave inputs very far from the sampled trajectories.
    generative: true
    n_samples_metrics: 20
    params:
      MAX_EPOCHS: 400
      RUN_TAG: _v3
      SELECT_BY_VAL: true
      GAP_FILL: osi
    xp:
      SIC:
        notebook: Notebook_flowmatching_model_DynFM_sic.ipynb
        log_dir: logs_DynFM_sic_v3
        status: existing
        params:
          MAX_TIME: "00:04:00:00"

  CMT_v3:
    # SIC: CM distilled from the FM_v3 teacher (OSI SAF gap fill), same fill in the CM inputs, from scratch.
    generative: true
    n_samples_metrics: 20
    params:
      MAX_EPOCHS: 600
      RUN_TAG: _v3
      GAP_FILL: osi
      FM_TEACHER_LOG: logs_FM_sic_v3
    xp:
      SIC:
        notebook: Notebook_consistency_model_CMT_sic.ipynb
        log_dir: logs_CMT_sic_v3
        status: existing
        params:
          MAX_TIME: "00:04:45:00"

  DynCMT_v3:
    # SIC: DynCM distilled from the DynFM_v3 teacher (OSI SAF gap fill), same fill in the DynCM inputs.
    generative: true
    n_samples_metrics: 20
    params:
      MAX_EPOCHS: 600
      RUN_TAG: _v3
      GAP_FILL: osi
      DYNFM_TEACHER_LOG: logs_DynFM_sic_v3
    xp:
      SIC:
        notebook: Notebook_consistency_model_DynCMT_sic.ipynb
        log_dir: logs_DynCMT_sic_v3
        status: existing
        params:
          MAX_TIME: "00:05:00:00"

  DynFM_v4:
    # SIC: DynFM_v3 fails in the transport (frame 0 as good as FM, RMSE 0.11 -> 0.20 from frame 1): SIC changes by
    # ~0.15-0.2 RMSE from one day to the next and the deterministic frame-to-frame interpolant never shows the
    # network a state off the true path. PHYS_NOISE perturbs the start frame of each physical segment at training
    # time, so the learned velocity steers a perturbed state back to the next frame (error-correcting transport).
    generative: true
    n_samples_metrics: 20
    params:
      MAX_EPOCHS: 400
      RUN_TAG: _v4
      SELECT_BY_VAL: true
      GAP_FILL: osi
      PHYS_NOISE: 0.1
    xp:
      SIC:
        notebook: Notebook_flowmatching_model_DynFM_sic.ipynb
        log_dir: logs_DynFM_sic_v4
        status: existing
        params:
          MAX_TIME: "00:04:00:00"

  DynCMT_v4:
    # SIC: DynCM distilled from DynFM_v4.
    generative: true
    n_samples_metrics: 20
    params:
      MAX_EPOCHS: 600
      RUN_TAG: _v4
      GAP_FILL: osi
      DYNFM_TEACHER_LOG: logs_DynFM_sic_v4
    xp:
      SIC:
        notebook: Notebook_consistency_model_DynCMT_sic.ipynb
        log_dir: logs_DynCMT_sic_v4
        status: existing
        params:
          MAX_TIME: "00:05:00:00"

  FM_aug:
    # SSH: FM_v2 trained with the same random D4 transform of (x, y) as VarCM (single 128x128 training region).
    generative: true
    n_samples_metrics: 20
    params:
      MAX_EPOCHS: 600
      RUN_TAG: _aug
      SELECT_BY_VAL: true
      AUGMENT: true
    xp:
      SSH_GF:
        notebook: Notebook_flowmatching_model_FM_ssh_gf.ipynb
        log_dir: logs_FM_ssh_gf_aug
        status: existing
        params:
          MAX_TIME: "00:04:00:00"

  DynFM_aug:
    # SSH: DynFM_v2 with the same random D4 transform of (x, y) as VarCM.
    generative: true
    n_samples_metrics: 20
    params:
      MAX_EPOCHS: 600
      RUN_TAG: _aug
      SELECT_BY_VAL: true
      AUGMENT: true
    xp:
      SSH_GF:
        notebook: Notebook_flowmatching_model_DynFM_ssh_gf.ipynb
        log_dir: logs_DynFM_ssh_gf_aug
        status: existing
        params:
          MAX_TIME: "00:04:00:00"

  CMT_v2:
    # CM (ODE-teacher targets) on SSH distilled from FM_v2, from scratch.
    generative: true
    n_samples_metrics: 20
    params:
      MAX_EPOCHS: 600
      RUN_TAG: _v2
      FM_TEACHER_LOG: logs_FM_ssh_gf_v2
      WARM_START: false
    xp:
      SSH_GF:
        notebook: Notebook_consistency_model_CMT_ssh_gf.ipynb
        log_dir: logs_CMT_ssh_gf_v2
        status: existing

  CMT_det:
    # Evaluation variant of CMT (GP) for the NFE sweep: deterministic pairwise chain instead of re-noised
    # multistep sampling (SWEEP_STOCHASTIC=False); used for the composition-gap test.
    generative: true
    n_samples_metrics: 20
    params:
      MAX_EPOCHS: 600
      SWEEP_STOCHASTIC: false
    xp:
      GP:
        notebook: Notebook_consistency_model_CMT_spde.ipynb
        log_dir: logs_CMT_spde
        status: existing

  VarDynCM_scratch_uni:
    # Evaluation variant of VarDynCM_scratch: uniform grids of N steps instead of the frame grid (NFE sweep and
    # composition gap on grids not seen in training).
    generative: true
    n_samples_metrics: 20
    params:
      MAX_EPOCHS: 200
      COND_MODE: grad
      LAMBDA_SELF: 0.1
      RUN_TAG: _scratch
      SELECT_BY_VAL: true
      FRAME_GRID: false
      EVAL_TAG: _uni
    xp:
      GP:
        notebook: Notebook_consistency_model_VarDynCM_spde.ipynb
        log_dir: logs_VarDynCM_crps_spde_grad_scratch
        status: existing

  VarDynCM_grid:
    # DynVarCM is not consistent on grids it was not trained on (NFE sweep: composition gap ~2 spreads). Fine-tune
    # VarDynCM_scratch (healthy, not collapsed) with rollouts on random refinements of the frame grid (K in 1..4
    # jumps per segment, random times), 40 epochs, validation-CRPS selection. Evaluated on the frame grid.
    generative: true
    n_samples_metrics: 20
    params:
      MAX_EPOCHS: 40
      COND_MODE: grad
      LAMBDA_SELF: 0.1
      GRID_REFINE: [1, 2, 3, 4]
      RUN_TAG: _grid
      WARM_FROM: logs_VarDynCM_crps_spde_grad_scratch
      SELECT_BY_VAL: true
      FRAME_GRID: true
    xp:
      GP:
        notebook: Notebook_consistency_model_VarDynCM_spde.ipynb
        log_dir: logs_VarDynCM_crps_spde_grad_grid
        status: existing

  VarDynCM_grid_uni:
    # Same model on uniform grids (NFE sweep, composition gap).
    generative: true
    n_samples_metrics: 20
    params:
      MAX_EPOCHS: 40
      COND_MODE: grad
      LAMBDA_SELF: 0.1
      GRID_REFINE: [1, 2, 3, 4]
      RUN_TAG: _grid
      WARM_FROM: logs_VarDynCM_crps_spde_grad_scratch
      SELECT_BY_VAL: true
      FRAME_GRID: false
      EVAL_TAG: _uni
    xp:
      GP:
        notebook: Notebook_consistency_model_VarDynCM_spde.ipynb
        log_dir: logs_VarDynCM_crps_spde_grad_grid
        status: existing

  VarCM_aug:
    # VarCM SSH from scratch over-fits the small SSH training set (validation CRPS minimal at epoch 31, rising
    # after; test RMSE 0.28). Same recipe with random rot90/flip of (x0, y) at training time.
    generative: true
    n_samples_metrics: 20
    params:
      MAX_EPOCHS: 250
      COND_MODE: grad
      RUN_TAG: _aug
      WARM_START: false
      SELECT_BY_VAL: true
      SHORT_CRPS: true
      AUGMENT: true
    xp:
      SSH_GF:
        notebook: Notebook_consistency_model_VarCM_ssh_gf.ipynb
        log_dir: logs_VarCM_crps2_ssh_gf_grad_aug
        status: existing

  VarDynCM_scratch_fr:
    # NFE sweep on refined frame grids (K uniform jumps per segment, grids containing the frame times).
    generative: true
    n_samples_metrics: 20
    params:
      MAX_EPOCHS: 200
      COND_MODE: "grad"
      LAMBDA_SELF: 0.1
      RUN_TAG: "_scratch"
      WARM_START: false
      SELECT_BY_VAL: true
      FRAME_GRID: true
      FRAME_REFINE_SWEEP: true
      EVAL_TAG: "_fr"
    xp:
      GP:
        notebook: Notebook_consistency_model_VarDynCM_spde.ipynb
        log_dir: logs_VarDynCM_crps_spde_grad_scratch
        status: existing

  VarDynCM_grid_fr:
    # Same for the model fine-tuned on random refinements.
    generative: true
    n_samples_metrics: 20
    params:
      MAX_EPOCHS: 40
      COND_MODE: "grad"
      LAMBDA_SELF: 0.1
      GRID_REFINE: [1, 2, 3, 4]
      RUN_TAG: "_grid"
      WARM_FROM: "logs_VarDynCM_crps_spde_grad_scratch"
      SELECT_BY_VAL: true
      FRAME_GRID: true
      FRAME_REFINE_SWEEP: true
      EVAL_TAG: "_fr"
    xp:
      GP:
        notebook: Notebook_consistency_model_VarDynCM_spde.ipynb
        log_dir: logs_VarDynCM_crps_spde_grad_grid
        status: existing

  VarDynCM_grid_ssh:
    # SSH, same recipe as the GP DynVarCM: VarDynCM_scratch (SSH) fine-tuned 40 epochs on random refinements of
    # the frame grid, validation-CRPS selection, evaluated on the frame grid.
    generative: true
    n_samples_metrics: 20
    params:
      MAX_EPOCHS: 40
      COND_MODE: grad
      LAMBDA_SELF: 0.1
      GRID_REFINE: [1, 2, 3, 4]
      RUN_TAG: _grid
      WARM_FROM: logs_VarDynCM_crps_ssh_gf_grad_scratch
      SELECT_BY_VAL: true
      FRAME_GRID: true
    xp:
      SSH_GF:
        notebook: Notebook_consistency_model_VarDynCM_ssh_gf.ipynb
        log_dir: logs_VarDynCM_crps_ssh_gf_grad_grid
        status: existing

  VarDynCM_grid_sic:
    # SIC, same recipe as SSH/GP: VarDynCM_scratch (SIC) fine-tuned 40 epochs on random refinements of the frame grid.
    generative: true
    n_samples_metrics: 20
    params:
      MAX_EPOCHS: 40
      COND_MODE: grad
      LAMBDA_SELF: 0.1
      GRID_REFINE: [1, 2, 3, 4]
      RUN_TAG: _grid
      WARM_FROM: logs_VarDynCM_crps_sic_grad_scratch
      SELECT_BY_VAL: true
      FRAME_GRID: true
    xp:
      SIC:
        notebook: Notebook_consistency_model_VarDynCM_sic.ipynb
        log_dir: logs_VarDynCM_crps_sic_grad_grid
        status: existing
        params:
          MAX_TIME: "00:03:00:00"

  VarCM_aug_student:
    # Evaluation of VarCM_aug with the student weights (the EMA of decay 0.99993 lags on short SSH runs).
    generative: true
    n_samples_metrics: 20
    params:
      MAX_EPOCHS: 250
      COND_MODE: "grad"
      RUN_TAG: "_aug"
      WARM_START: false
      SELECT_BY_VAL: true
      SHORT_CRPS: true
      AUGMENT: true
      SAVE_STUDENT: true
      EVAL_TAG: "_student"
    xp:
      SSH_GF:
        notebook: Notebook_consistency_model_VarCM_ssh_gf.ipynb
        log_dir: logs_VarCM_crps2_ssh_gf_grad_aug
        status: existing
      SIC:
        # same recipe as SSH (D4 augmentation, student weights); J_o = SAR + coarse OSI SAF (sic_costs.py)
        notebook: Notebook_consistency_model_VarCM_sic.ipynb
        log_dir: logs_VarCM_crps2_sic_grad_aug
        status: existing
        params:
          MAX_TIME: "00:07:00:00"

  VarCM_scratch_student:
    # Same for VarCM_scratch (SSH).
    generative: true
    n_samples_metrics: 20
    params:
      MAX_EPOCHS: 250
      COND_MODE: "grad"
      RUN_TAG: "_scratch"
      WARM_START: false
      SELECT_BY_VAL: true
      SHORT_CRPS: true
      SAVE_STUDENT: true
      EVAL_TAG: "_student"
    xp:
      SSH_GF:
        notebook: Notebook_consistency_model_VarCM_ssh_gf.ipynb
        log_dir: logs_VarCM_crps2_ssh_gf_grad_scratch
        status: existing

  VarCM_scratch2_student:
    # GP VarCM (final) evaluated with the student weights, as the SSH VarCM (homogeneous protocol).
    generative: true
    n_samples_metrics: 20
    params:
      MAX_EPOCHS: 150
      COND_MODE: grad
      RUN_TAG: _scratch2
      WARM_FROM: logs_VarCM_crps2_spde_grad_scratch
      SELECT_BY_VAL: true
      SHORT_CRPS: true
      SAVE_STUDENT: true
      EVAL_TAG: _student
    xp:
      GP:
        notebook: Notebook_consistency_model_VarCM_spde.ipynb
        log_dir: logs_VarCM_crps2_spde_grad_scratch2
        status: existing

  VarCM_ls01:
    # ICLR rebuttal (GP), second CRPS stage: self-consistency weight 0.1 (was 1), 100 epochs from VarCM (crps2,
    # 300 epochs), checkpoint chosen on the validation CRPS of the ensemble. Same notebook as VarCM.
    generative: true
    n_samples_metrics: 20
    params:
      MAX_EPOCHS: 100
      COND_MODE: grad
      LAMBDA_SELF: 0.1
      RUN_TAG: _ls01
      WARM_FROM: logs_VarCM_crps2_spde_grad
      SELECT_BY_VAL: true
    xp:
      GP:
        notebook: Notebook_consistency_model_VarCM_spde.ipynb
        log_dir: logs_VarCM_crps2_spde_grad_ls01
        status: existing

  VarCM_v3:
    # ICLR rebuttal (GP), VarCM v3: no L2 target left (short anchor scored by the CRPS) and the CRPS also applied
    # to the evaluation sampler's own K-step chain (K in {3,5,8,15}); 100 epochs from VarCM (crps2, 300 epochs),
    # checkpoint chosen on the validation CRPS. Same notebook as VarCM.
    generative: true
    n_samples_metrics: 20
    params:
      MAX_EPOCHS: 100
      COND_MODE: grad
      RUN_TAG: _v3
      WARM_FROM: logs_VarCM_crps2_spde_grad
      SELECT_BY_VAL: true
      SHORT_CRPS: true
      ROLLOUT_STEPS: [3, 5, 8, 15]
    xp:
      GP:
        notebook: Notebook_consistency_model_VarCM_spde.ipynb
        log_dir: logs_VarCM_crps2_spde_grad_v3
        status: existing

  VarCM_scratch:
    # ICLR rebuttal (GP), VarCM test: all VarCM CRPS runs started from the submitted (collapsed) v1 and stay on
    # the same plateau (val CRPS ~1.25, SSR ~0.2) whatever the loss terms. Hypothesis: the collapsed start leaves
    # the noise pathway dead. Same v3 objective (no L2 target) trained FROM SCRATCH, 250 epochs, validation-CRPS
    # selection. Also the cleaner story: no dependence on the submitted model.
    generative: true
    n_samples_metrics: 20
    params:
      MAX_EPOCHS: 250
      COND_MODE: grad
      RUN_TAG: _scratch
      WARM_START: false
      SELECT_BY_VAL: true
      SHORT_CRPS: true
    xp:
      GP:
        notebook: Notebook_consistency_model_VarCM_spde.ipynb
        log_dir: logs_VarCM_crps2_spde_grad_scratch
        status: existing
      SSH_GF:
        notebook: Notebook_consistency_model_VarCM_ssh_gf.ipynb
        log_dir: logs_VarCM_crps2_ssh_gf_grad_scratch
        status: existing


  VarCM_scratch2:
    # Continuation of VarCM_scratch: the validation CRPS was still decreasing at epoch 249 (best = last, 0.856).
    # 150 more epochs, same objective, validation-CRPS selection.
    generative: true
    n_samples_metrics: 20
    params:
      MAX_EPOCHS: 150
      COND_MODE: grad
      RUN_TAG: _scratch2
      WARM_FROM: logs_VarCM_crps2_spde_grad_scratch
      SELECT_BY_VAL: true
      SHORT_CRPS: true
    xp:
      GP:
        notebook: Notebook_consistency_model_VarCM_spde.ipynb
        log_dir: logs_VarCM_crps2_spde_grad_scratch2
        status: existing

  VarDynCM_ls01:
    # ICLR rebuttal (GP): self-consistency weight 0.1 (was 1; L_comp fought the CRPS and the 200-epoch run
    # degraded), 100 epochs from the submitted VarDynCM, checkpoint chosen on the validation CRPS. Same notebook.
    generative: true
    n_samples_metrics: 20
    params:
      MAX_EPOCHS: 100
      COND_MODE: grad
      LAMBDA_SELF: 0.1
      RUN_TAG: _ls01
      SELECT_BY_VAL: true
    xp:
      GP:
        notebook: Notebook_consistency_model_VarDynCM_spde.ipynb
        log_dir: logs_VarDynCM_crps_spde_grad_ls01
        status: existing

  VarDynCM_fg:
    # Evaluation variant of VarDynCM (CRPS, 200 epochs): sampled on the frame grid it is trained on
    # (1 -> IC, then one jump per frame, C network calls) instead of 25 uniform steps.
    generative: true
    n_samples_metrics: 20
    params:
      MAX_EPOCHS: 200
      COND_MODE: grad
      FRAME_GRID: true
      EVAL_TAG: _fg
    xp:
      GP:
        notebook: Notebook_consistency_model_VarDynCM_spde.ipynb
        log_dir: logs_VarDynCM_crps_spde_grad
        status: existing

  VarDynCM_ls01_fg:
    # Same for VarDynCM_ls01 (best validation-CRPS checkpoint, which was scored on that frame grid).
    generative: true
    n_samples_metrics: 20
    params:
      MAX_EPOCHS: 100
      COND_MODE: grad
      LAMBDA_SELF: 0.1
      RUN_TAG: _ls01
      SELECT_BY_VAL: true
      FRAME_GRID: true
      EVAL_TAG: _fg
    xp:
      GP:
        notebook: Notebook_consistency_model_VarDynCM_spde.ipynb
        log_dir: logs_VarDynCM_crps_spde_grad_ls01
        status: existing

  VarDynCM_ls01b:
    # Continuation of VarDynCM_ls01 (validation CRPS still decreasing at epoch 99): 100 more epochs, weight 0.1,
    # validation-CRPS selection, evaluated on the frame grid it is trained on.
    generative: true
    n_samples_metrics: 20
    params:
      MAX_EPOCHS: 100
      COND_MODE: grad
      LAMBDA_SELF: 0.1
      RUN_TAG: _ls01b
      WARM_FROM: logs_VarDynCM_crps_spde_grad_ls01
      SELECT_BY_VAL: true
      FRAME_GRID: true
    xp:
      GP:
        notebook: Notebook_consistency_model_VarDynCM_spde.ipynb
        log_dir: logs_VarDynCM_crps_spde_grad_ls01b
        status: existing

  VarDynCM_ic:
    # VarDynCM_ls01b frame by frame: SSR 0.20 at the IC rising to 0.63 at the last frame. Test: extra CRPS
    # weight on the first frame (W_IC=4, i.e. about as much as the rest of the window), 100 epochs from ls01b,
    # frame grid, validation-CRPS selection.
    generative: true
    n_samples_metrics: 20
    params:
      MAX_EPOCHS: 100
      COND_MODE: grad
      LAMBDA_SELF: 0.1
      W_IC: 4.0
      RUN_TAG: _ic
      WARM_FROM: logs_VarDynCM_crps_spde_grad_ls01b
      SELECT_BY_VAL: true
      FRAME_GRID: true
    xp:
      GP:
        notebook: Notebook_consistency_model_VarDynCM_spde.ipynb
        log_dir: logs_VarDynCM_crps_spde_grad_ic
        status: existing

  VarDynCM_scratch:
    # VarCM from scratch reached SSR 0.81 (vs 0.20 warm-started from the collapsed v1): same test for VarDynCM,
    # whose IC is collapsed (SSR 0.20 at frame 0). From scratch, weight 0.1, frame grid, validation selection.
    generative: true
    n_samples_metrics: 20
    params:
      MAX_EPOCHS: 200
      COND_MODE: grad
      LAMBDA_SELF: 0.1
      RUN_TAG: _scratch
      WARM_START: false
      SELECT_BY_VAL: true
      FRAME_GRID: true
    xp:
      GP:
        notebook: Notebook_consistency_model_VarDynCM_spde.ipynb
        log_dir: logs_VarDynCM_crps_spde_grad_scratch
        status: existing
      SSH_GF:
        notebook: Notebook_consistency_model_VarDynCM_ssh_gf.ipynb
        log_dir: logs_VarDynCM_crps_ssh_gf_grad_scratch
        status: existing
      SIC:
        notebook: Notebook_consistency_model_VarDynCM_sic.ipynb
        log_dir: logs_VarDynCM_crps_sic_grad_scratch
        status: existing
        params:
          MAX_TIME: "00:08:00:00"


  VarDynCM_v1:
    # Submitted version (L2 anchors), kept for the comparison. GP only.
    generative: true
    n_samples_metrics: 20
    params:
      COND_MODE: grad
    xp:
