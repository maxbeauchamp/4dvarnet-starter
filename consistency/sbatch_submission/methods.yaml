# Methods of the paper (Tables 2-3, NFE studies), per benchmark (GP, SSH_GF, SIC).
#
# Table rows -> method keys:
#   GP:  FM, CMT (CM), VarCM_scratch2_student (VarCM), DynFM, DynCMT (DynCM), VarDynCM_grid (DynVarCM), UNet, 4dvarnet_lstm
#   SSH: FM_aug, CMT_aug, VarCM_aug_student, DynFM_v2, DynCMT, VarDynCM_scratch, UNet, 4dvarnet_lstm
#   SIC: FM_v3, CMT_v3, VarCM_aug_student, DynFM_v3, DynCMT_v3, VarDynCM_grid_sic, UNet, 4dvarnet_lstm
# Training dependencies: VarCM_scratch (warm start of VarCM_scratch2*), VarDynCM_scratch (warm start of the *_grid
# models); CMT / DynCMT (GP) warm-start from the submitted logs_CT_CM_spde / logs_CT_DynCM_spde and use the FM / DynFM
# teachers; VarCM_scratch2 and VarDynCM_grid_fr are the evaluation variants used by the GP NFE sweep.
#
# generative: ensemble methods (n_samples_metrics members); log_dir: checkpoint folder written by the notebook,
# relative to Notebooks_<XP>/; params: papermill overrides (method level, then xp level).
# NB 4dvarnet_lstm GP/SSH: the checkpoints on Odyssey are logs_4dvarnet_unet_spde / logs_4dvarnet_unet (SOLVER_TYPE=unet).

methods:
  FM:
    generative: true
    n_samples_metrics: 20
    params: {}
    xp:
      GP:
        notebook: Notebook_flowmatching_model_FM_spde.ipynb
        log_dir: logs_FM_spde
  CMT:
    generative: true
    n_samples_metrics: 20
    params:
      MAX_EPOCHS: 600
    xp:
      GP:
        notebook: Notebook_consistency_model_CMT_spde.ipynb
        log_dir: logs_CMT_spde
  VarCM_scratch:
    generative: true
    n_samples_metrics: 20
    params:
      MAX_EPOCHS: 250
      COND_MODE: grad
      RUN_TAG: _scratch
      WARM_START: false
      SELECT_BY_VAL: true
      SHORT_CRPS: true
    xp:
      GP:
        notebook: Notebook_consistency_model_VarCM_spde.ipynb
        log_dir: logs_VarCM_crps2_spde_grad_scratch
  VarCM_scratch2:
    generative: true
    n_samples_metrics: 20
    params:
      MAX_EPOCHS: 150
      COND_MODE: grad
      RUN_TAG: _scratch2
      WARM_FROM: logs_VarCM_crps2_spde_grad_scratch
      SELECT_BY_VAL: true
      SHORT_CRPS: true
    xp:
      GP:
        notebook: Notebook_consistency_model_VarCM_spde.ipynb
        log_dir: logs_VarCM_crps2_spde_grad_scratch2
  VarCM_scratch2_student:
    generative: true
    n_samples_metrics: 20
    params:
      MAX_EPOCHS: 150
      COND_MODE: grad
      RUN_TAG: _scratch2
      WARM_FROM: logs_VarCM_crps2_spde_grad_scratch
      SELECT_BY_VAL: true
      SHORT_CRPS: true
      SAVE_STUDENT: true
      EVAL_TAG: _student
    xp:
      GP:
        notebook: Notebook_consistency_model_VarCM_spde.ipynb
        log_dir: logs_VarCM_crps2_spde_grad_scratch2
  DynFM:
    generative: true
    n_samples_metrics: 20
    params: {}
    xp:
      GP:
        notebook: Notebook_flowmatching_model_DynFM_spde.ipynb
        log_dir: logs_DynFM_spde
  DynCMT:
    generative: true
    n_samples_metrics: 20
    params:
      MAX_EPOCHS: 600
    xp:
      GP:
        notebook: Notebook_consistency_model_DynCMT_spde.ipynb
        log_dir: logs_DynCMT_spde
      SSH_GF:
        notebook: Notebook_consistency_model_DynCMT_ssh_gf.ipynb
        log_dir: logs_DynCMT_ssh_gf
  VarDynCM_scratch:
    generative: true
    n_samples_metrics: 20
    params:
      MAX_EPOCHS: 200
      COND_MODE: grad
      LAMBDA_SELF: 0.1
      RUN_TAG: _scratch
      WARM_START: false
      SELECT_BY_VAL: true
      FRAME_GRID: true
    xp:
      GP:
        notebook: Notebook_consistency_model_VarDynCM_spde.ipynb
        log_dir: logs_VarDynCM_crps_spde_grad_scratch
      SSH_GF:
        notebook: Notebook_consistency_model_VarDynCM_ssh_gf.ipynb
        log_dir: logs_VarDynCM_crps_ssh_gf_grad_scratch
      SIC:
        notebook: Notebook_consistency_model_VarDynCM_sic.ipynb
        log_dir: logs_VarDynCM_crps_sic_grad_scratch
        params:
          MAX_TIME: 00:08:00:00
  VarDynCM_grid:
    generative: true
    n_samples_metrics: 20
    params:
      MAX_EPOCHS: 40
      COND_MODE: grad
      LAMBDA_SELF: 0.1
      GRID_REFINE:
      - 1
      - 2
      - 3
      - 4
      RUN_TAG: _grid
      WARM_FROM: logs_VarDynCM_crps_spde_grad_scratch
      SELECT_BY_VAL: true
      FRAME_GRID: true
    xp:
      GP:
        notebook: Notebook_consistency_model_VarDynCM_spde.ipynb
        log_dir: logs_VarDynCM_crps_spde_grad_grid
  VarDynCM_grid_fr:
    generative: true
    n_samples_metrics: 20
    params:
      MAX_EPOCHS: 40
      COND_MODE: grad
      LAMBDA_SELF: 0.1
      GRID_REFINE:
      - 1
      - 2
      - 3
      - 4
      RUN_TAG: _grid
      WARM_FROM: logs_VarDynCM_crps_spde_grad_scratch
      SELECT_BY_VAL: true
      FRAME_GRID: true
      FRAME_REFINE_SWEEP: true
      EVAL_TAG: _fr
    xp:
      GP:
        notebook: Notebook_consistency_model_VarDynCM_spde.ipynb
        log_dir: logs_VarDynCM_crps_spde_grad_grid
  UNet:
    generative: false
    n_samples_metrics: 1
    params: {}
    xp:
      GP:
        notebook: Notebook_direct_unet_spde.ipynb
        log_dir: logs_direct_unet_GP
      SSH_GF:
        notebook: Notebook_direct_unet.ipynb
        log_dir: logs_direct_unet
        params:
          MAX_TIME: 00:01:15:00
      SIC:
        notebook: Notebook_direct_unet_sic.ipynb
        log_dir: logs_direct_unet_SIC
        params:
          MAX_TIME: 00:02:00:00
  4dvarnet_lstm:
    generative: false
    n_samples_metrics: 1
    params:
      SOLVER_TYPE: lstm
    xp:
      GP:
        notebook: Notebook_4dvarnet_unet_spde.ipynb
        log_dir: logs_4dvarnet_lstm_spde
      SSH_GF:
        notebook: Notebook_4dvarnet_unet.ipynb
        log_dir: logs_4dvarnet_lstm
      SIC:
        notebook: Notebook_4dvarnet_unet_sic.ipynb
        log_dir: logs_4dvarnet_lstm_sic
        params:
          MAX_TIME: 00:03:00:00
  FM_aug:
    generative: true
    n_samples_metrics: 20
    params:
      MAX_EPOCHS: 600
      RUN_TAG: _aug
      SELECT_BY_VAL: true
      AUGMENT: true
    xp:
      SSH_GF:
        notebook: Notebook_flowmatching_model_FM_ssh_gf.ipynb
        log_dir: logs_FM_ssh_gf_aug
        params:
          MAX_TIME: 00:04:00:00
  CMT_aug:
    generative: true
    n_samples_metrics: 20
    params:
      MAX_EPOCHS: 600
      RUN_TAG: _aug
      FM_TEACHER_LOG: logs_FM_ssh_gf_aug
      WARM_START: false
    xp:
      SSH_GF:
        notebook: Notebook_consistency_model_CMT_ssh_gf.ipynb
        log_dir: logs_CMT_ssh_gf_aug
        params:
          MAX_TIME: 00:05:30:00
  VarCM_aug_student:
    generative: true
    n_samples_metrics: 20
    params:
      MAX_EPOCHS: 250
      COND_MODE: grad
      RUN_TAG: _aug
      WARM_START: false
      SELECT_BY_VAL: true
      SHORT_CRPS: true
      AUGMENT: true
      SAVE_STUDENT: true
      EVAL_TAG: _student
    xp:
      SSH_GF:
        notebook: Notebook_consistency_model_VarCM_ssh_gf.ipynb
        log_dir: logs_VarCM_crps2_ssh_gf_grad_aug
      SIC:
        notebook: Notebook_consistency_model_VarCM_sic.ipynb
        log_dir: logs_VarCM_crps2_sic_grad_aug
        params:
          MAX_TIME: 00:07:00:00
  DynFM_v2:
    generative: true
    n_samples_metrics: 20
    params:
      MAX_EPOCHS: 400
      RUN_TAG: _v2
      SELECT_BY_VAL: true
    xp:
      SSH_GF:
        notebook: Notebook_flowmatching_model_DynFM_ssh_gf.ipynb
        log_dir: logs_DynFM_ssh_gf_v2
  FM_v3:
    generative: true
    n_samples_metrics: 20
    params:
      MAX_EPOCHS: 400
      RUN_TAG: _v3
      SELECT_BY_VAL: true
      GAP_FILL: osi
    xp:
      SIC:
        notebook: Notebook_flowmatching_model_FM_sic.ipynb
        log_dir: logs_FM_sic_v3
        params:
          MAX_TIME: 00:02:45:00
  CMT_v3:
    generative: true
    n_samples_metrics: 20
    params:
      MAX_EPOCHS: 600
      RUN_TAG: _v3
      GAP_FILL: osi
      FM_TEACHER_LOG: logs_FM_sic_v3
    xp:
      SIC:
        notebook: Notebook_consistency_model_CMT_sic.ipynb
        log_dir: logs_CMT_sic_v3
        params:
          MAX_TIME: 00:04:45:00
          CM_NSTEPS: 4
          CM_STOCHASTIC: true
  DynFM_v3:
    generative: true
    n_samples_metrics: 20
    params:
      MAX_EPOCHS: 400
      RUN_TAG: _v3
      SELECT_BY_VAL: true
      GAP_FILL: osi
    xp:
      SIC:
        notebook: Notebook_flowmatching_model_DynFM_sic.ipynb
        log_dir: logs_DynFM_sic_v3
        params:
          MAX_TIME: 00:04:00:00
  DynCMT_v3:
    generative: true
    n_samples_metrics: 20
    params:
      MAX_EPOCHS: 600
      RUN_TAG: _v3
      GAP_FILL: osi
      DYNFM_TEACHER_LOG: logs_DynFM_sic_v3
    xp:
      SIC:
        notebook: Notebook_consistency_model_DynCMT_sic.ipynb
        log_dir: logs_DynCMT_sic_v3
        params:
          MAX_TIME: 00:05:00:00
  VarDynCM_grid_sic:
    generative: true
    n_samples_metrics: 20
    params:
      MAX_EPOCHS: 40
      COND_MODE: grad
      LAMBDA_SELF: 0.1
      GRID_REFINE:
      - 1
      - 2
      - 3
      - 4
      RUN_TAG: _grid
      WARM_FROM: logs_VarDynCM_crps_sic_grad_scratch
      SELECT_BY_VAL: true
      FRAME_GRID: true
    xp:
      SIC:
        notebook: Notebook_consistency_model_VarDynCM_sic.ipynb
        log_dir: logs_VarDynCM_crps_sic_grad_grid
        params:
          MAX_TIME: 00:03:00:00
xp_notebook_dir:
  GP: Notebooks_GP
  SIC: Notebooks_SIC
  SSH_GF: Notebooks_SSH_GF
max_epochs: 2000
xp_has_nan_target:
  GP: false
  SIC: true
  SSH_GF: false
